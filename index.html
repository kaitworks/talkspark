["Describe a time when you had to make a speech or give a toast.", ["What the occasion was", "Who was there", "What you said", "Explain how you felt"], "inter", "I once had to give a short toast at my best friend's wedding. I was honored, but also terrified, as there were about two hundred guests. I wrote a brief speech that included a funny story about how the couple met. When I stood up, my voice trembled slightly, but I raised my glass and carried on. The guests laughed at the right moments, which boosted my confidence. I ended by wishing them a lifetime of happiness. Afterwards, the bride hugged me and said it was the highlight of the evening. In the end, it was a blessing in disguise that left a lasting impression on me."],
["Describe a time you stayed at a friend's or relative's home.", ["Whose home it was", "How long you stayed", "What you did there", "Explain how you felt"], "easy", "I stayed at my cousin's house in Da Nang for a week last summer. She lives close to the beach, so we went swimming every morning. In the afternoon, we explored local markets and cooked dinner together. In the evening, we sat on the balcony and caught up on each other's lives. I felt completely at home because she treated me like a sister. The visit was relaxing and brought us closer. I'm planning to invite her to stay with me next year. It gave me firsthand insight into how others live, and I try to make the most of every similar chance. It was a thought-provoking lesson that helped me expand my horizons."],
["Describe a time when you were disappointed.", ["What happened", "Who was involved", "How you reacted", "Explain what you learned from it"], "inter", "I was very disappointed when I didn't get a scholarship I had applied for. I had spent weeks preparing documents and rehearsing for the interview. When the email arrived, I felt crushed and ashamed. For a few days, I avoided talking about it. Eventually, I asked for feedback and learned that I had focused too much on grades instead of my personal story. I applied again the following year with a stronger application and succeeded. The setback taught me that disappointment can be a stepping stone to improvement."],
["Describe an intelligent person you know.", ["Who the person is", "How you know them", "What makes them intelligent", "Explain how you feel about them"], "inter", "I'd like to talk about my university professor, Dr. Linh, who is one of the smartest people I know. She speaks four languages and has published research on renewable energy. What impresses me is not only her knowledge, but also her ability to explain complex ideas simply. She listens carefully to students and treats every question seriously. In class, she often links theory to real-life problems, which makes learning exciting. I admire her humility, because she openly admits when she doesn't know something. She has been a major influence on my academic goals."],
["Describe a time when you needed to follow instructions.", ["What you had to do", "Who gave the instructions", "Whether they were clear", "Explain what happened"], "easy", "I once had to assemble a bookshelf by following a set of instructions written only in pictures. There were dozens of screws and wooden panels, and I felt confused at the start. I laid out all the pieces and checked each step carefully before moving on. When I made a mistake in step six, I had to undo everything and start again. It took me nearly three hours, but I finally managed to finish it. I felt proud when the shelf stood firmly against the wall. The experience showed me how important it is to read instructions carefully. Looking back, it was an eye-opening experience that broadened my horizons. I still have fond memories of it, and it gave me a real sense of achievement."],
["Describe a time when you felt bored.", ["Where you were", "What you were doing", "How long it lasted", "Explain what you did about it"], "easy", "I felt incredibly bored at a long family gathering where the conversation was mostly about topics I didn't know. I had finished my food, and there was nothing else to do. I scrolled through my phone, but the signal was weak. After a while, I started playing a word game with my younger cousin to pass the time. We invented funny stories, and soon other kids joined us. It turned the boring afternoon into an enjoyable one. I learned that you can always create your own fun. It was a steep learning curve, but it boosted my confidence for the future. Even now, remembering that moment gives me peace of mind."],
["Describe a time when someone gave you directions.", ["Where you were", "Who helped you", "What the directions were", "Explain how helpful they were"], "easy", "During a trip to Hanoi, I couldn't find my homestay in the maze of narrow alleys. My phone's map kept pointing me in circles. A friendly old man selling newspapers noticed my confusion and offered to help. He explained the route slowly, using landmarks such as a pharmacy and a blue gate. I followed his advice and reached the homestay in ten minutes. I thanked him with a big smile and bought a newspaper. His kindness reminded me that technology can't always replace local knowledge."],
["Describe a time you tried to reduce your waste.", ["What you did", "When you started", "What difficulties you faced", "Explain what the results were"], "inter", "About a year ago, I decided to cut down on household waste. I began by bringing my own bags and containers when shopping. I also stopped buying bottled water and switched to a refillable bottle. At first, it was inconvenient, and I sometimes forgot my bags. Gradually, it became second nature, and the amount of trash I produce each week has halved. The experience made me more mindful of what I buy. It also saved me money in the long run."],
["Describe a time when you met someone famous.", ["Who it was", "Where you met", "What happened", "Explain how you felt"], "inter", "I once met a famous Vietnamese author at a book signing in Ho Chi Minh City. I had admired his novels since high school, so I arrived early and joined the queue. When my turn came, I was so nervous that I could hardly speak. He smiled, asked my name and wrote a short message in my copy. We exchanged a few words about my favorite story, and he thanked me for reading it. I left feeling thrilled and slightly starstruck. I still keep that book on my desk as a treasured memory."],
["Describe an unusual meal you have had.", ["What you ate", "Where you were", "Who you were with", "Explain what you thought of it"], "inter", "I had an unusual meal at a night market in Thailand, where I tried fried insects. My friends dared me, and curiosity got the better of me. The crickets were crunchy and seasoned with chili and lime. Surprisingly, they tasted a bit like salty chips. I was hesitant at first, but after a few bites, I started to enjoy them. We laughed a lot at each other's reactions. It was a fun reminder that food culture can challenge our assumptions."],
["Describe a time you shared a meal with people from another culture.", ["Who you ate with", "Where it happened", "What you ate", "Explain what you learned"], "inter", "I once had dinner with an exchange student from Mexico at a friend's apartment. She cooked tacos with homemade salsa, and we taught her how to roll fresh spring rolls. We sat on the floor and compared our customs, from greetings to holidays. I was surprised at how many similarities there were between our family traditions. The spicy flavors were new to me, but I loved the fresh, bold taste. The evening broadened my perspective and made me curious about her country. Food turned out to be the easiest way to connect. It was a heartwarming moment that gave me a sense of belonging. In the end, it was a blessing in disguise that left a lasting impression on me."],
["Describe a time you felt very excited about something.", ["What it was", "Why you were excited", "Who you told", "Explain what happened"], "easy", "I was extremely excited the day before my first overseas trip. I had never left Vietnam, and I'd been planning every detail for months. I packed my suitcase three times and could hardly sleep that night. The next morning, I arrived at the airport two hours early. When the plane took off, I pressed my face against the window and watched the city shrink below me. It felt like the beginning of a new chapter. Even now, I remember the thrill vividly. It gave me firsthand insight into how others live, and I try to make the most of every similar chance. It was a thought-provoking lesson that helped me expand my horizons."],
["Describe a time when you got up very early.", ["When it was", "Why you got up early", "What you did", "Explain how you felt"], "easy", "I got up at four in the morning to watch the sunrise at Mui Ne's sand dunes. My friends and I took a jeep through the dark, bumping along the sandy road. When we arrived, the air was cool and the sky was slowly turning pink. We climbed a dune and sat quietly while the sun rose above the horizon. It was one of the most beautiful sights I've ever seen. I felt sleepy but wonderfully awake. I would happily do it again. Looking back, it was an eye-opening experience that broadened my horizons. I still have fond memories of it, and it gave me a real sense of achievement."],
["Describe a stranger who helped you.", ["Who the person was", "Where it happened", "How they helped", "Explain how you felt"], "easy", "Once, I lost my wallet on a bus in Ho Chi Minh City. I realized only after I got off and panicked because it held my ID and cash. A few minutes later, a stranger ran toward me and handed it back. He had noticed it fall and followed me. I was speechless with gratitude and tried to give him a reward, but he refused. His honesty restored my faith in people. I still think about him whenever I see someone in trouble."],
["Describe a decision you made that you later regretted.", ["What the decision was", "Why you made it", "What happened", "Explain what you learned"], "inter", "I regret quitting a language course halfway through because I felt too busy. At the time, I convinced myself that I would resume later. However, months passed, and I lost the progress I had made. When I finally went back, I had to start almost from the beginning. It was frustrating to realize how much time I had wasted. The experience taught me that consistency matters more than intensity. I now stick to smaller commitments that I can maintain. It was a steep learning curve, but it boosted my confidence for the future. Even now, remembering that moment gives me peace of mind."],
["Describe a place where you have spent a lot of time.", ["Where it is", "How long you've been going there", "What you do there", "Explain how you feel about it"], "easy", "I have spent countless hours in my local gym. It's a small, friendly place with old equipment but a warm community. I go there four times a week after work to lift weights and run on the treadmill. The trainers know me by name, and we often chat about our progress. I feel comfortable there because nobody judges you. It has become an essential part of my routine, and I would feel lost without it."],
["Describe a time you used a map or GPS.", ["Where you were", "Why you needed it", "What happened", "Explain how useful it was"], "easy", "I relied heavily on GPS during a road trip through the central highlands. The roads were winding, and signs were rare. The app guided us through mountain passes and warned us about traffic. At one point, it directed us onto a narrow dirt road, which turned out to be a shortcut. We arrived earlier than expected, and the views were spectacular. Without the app, we would have been completely lost. It proved to be an invaluable tool. It was a heartwarming moment that gave me a sense of belonging."],
["Describe a time you tried to fix a problem.", ["What the problem was", "What you did", "Who helped you", "Explain whether you solved it"], "inter", "Last year, my laptop suddenly stopped connecting to the internet before an important online meeting. I panicked at first, but then I restarted the router and checked the settings. Nothing worked, so I searched for solutions online and found a tutorial about resetting network drivers. After following the steps carefully, the connection came back just minutes before the meeting. I felt a huge sense of relief and accomplishment. Since then, I've become more confident about troubleshooting technical problems on my own."],
["Describe a time you spent a day without technology.", ["When it was", "Where you were", "What you did", "Explain how you felt"], "inter", "Last month, I tried a full day without my phone or laptop. I went to a small village with my family and left my devices at home. Instead of scrolling, I read a novel, helped my uncle in the vegetable garden and played cards with my cousins. At first, I kept reaching for my pocket out of habit. After a few hours, I felt calmer and more present. The day taught me how much time I waste online. I now try to unplug for at least one day every month. In the end, it was a blessing in disguise that left a lasting impression on me. It gave me firsthand insight into how others live, and I try to make the most of every similar chance."],
["Describe a person who is a good leader.", ["Who the person is", "How you know them", "What they do as a leader", "Explain why they are good"], "inter", "My former team leader, Mr. Khoa, is the best leader I have worked with. He listens carefully to everyone's ideas and gives credit when the team succeeds. When mistakes happen, he focuses on solutions rather than blame. He also sets clear goals, so we always know what to prioritize. What makes him special is that he leads by example, often staying late to help us. Thanks to him, our team was motivated and loyal. He has shaped my own idea of leadership. It was a thought-provoking lesson that helped me expand my horizons. Looking back, it was an eye-opening experience that broadened my horizons."],
["Describe a time you tried a traditional activity.", ["What the activity was", "Where you did it", "Who taught you", "Explain what you thought of it"], "easy", "During a trip to the northern mountains, I tried weaving brocade with a local ethnic woman. She showed me how to thread the loom and create a simple pattern. It looked easy when she did it, but my fingers kept tangling the threads. We laughed a lot at my attempts. Eventually, I finished a small bookmark and she gave it to me as a souvenir. I appreciated how much patience and skill traditional crafts require. It made me value handmade products more."],
["Describe a time when you wanted to buy something expensive.", ["What you wanted", "Why you wanted it", "What you decided", "Explain how you felt"], "inter", "I once wanted to buy an expensive pair of headphones that cost almost half of my monthly salary. I loved music and thought they would improve my daily life. However, I wasn't sure whether it was a sensible purchase. I waited for a month, compared reviews and set a savings target. In the end, I decided to buy a cheaper model with good reviews. I was happy with that choice because I felt financially responsible. I learned that waiting helps me separate needs from impulses."],
["Describe a time you were involved in a team activity.", ["What the activity was", "Who was in the team", "What your role was", "Explain how it went"], "easy", "I joined a volleyball team organized by my company last year. There were twelve of us, and we practiced twice a week after work. I played as a setter, which meant helping teammates attack the ball. At first, we lost most of our matches because we weren't used to each other. With practice, our coordination improved, and we reached the semifinal. We didn't win the trophy, but we became much closer. It was a great way to relieve stress and build friendships. I still have fond memories of it, and it gave me a real sense of achievement."],
["Describe an interesting talk or lecture you attended.", ["What the topic was", "Where it took place", "Who gave it", "Explain why it was interesting"], "inter", "I attended a talk about sleep science at a university seminar. The speaker, a neurologist, explained how sleep cycles affect memory and mood. She shared surprising facts, such as the fact that missing just one hour of sleep can reduce concentration. The presentation was engaging because she used humor and real-life examples. I took plenty of notes and later changed my bedtime routine. It was a rare lecture that actually influenced my behavior. I recommended it to several friends."],
["Describe a time you were pleased with a purchase.", ["What you bought", "Where you bought it", "Why you bought it", "Explain why you were pleased"], "easy", "I was very pleased with a pair of comfortable walking shoes I bought last year. I found them at a small shop during a sale. I needed them for my daily commute, which includes a lot of walking. The shoes are lightweight and supportive, and they've lasted over a year without any damage. I was pleased because they cost less than I expected and improved my daily comfort. I've recommended the shop to my colleagues. It was a steep learning curve, but it boosted my confidence for the future. Even now, remembering that moment gives me peace of mind."],
["Describe a time you took part in a competition.", ["What the competition was", "When it was", "How you prepared", "Explain how it ended"], "inter", "I once took part in a university debate competition. My team prepared for weeks by researching the topic and practicing rebuttals. On the day, I was assigned to speak second, which made me extremely nervous. However, once I started, I focused on my main points and spoke confidently. We reached the finals but narrowly lost to a stronger team. Even so, I gained valuable skills, such as critical thinking and speaking under pressure. I'm grateful for the experience."],
["Describe a time you made someone laugh.", ["Who you made laugh", "What happened", "Where you were", "Explain how you felt"], "easy", "At a family dinner, I accidentally mixed up the words in a Vietnamese proverb and said something absurd. For a second, nobody spoke, and then my grandmother burst out laughing. Soon the entire table was in tears. I was embarrassed at first, but then I realized how nice it was to hear everyone laughing together. We kept repeating the phrase as a joke for weeks. It reminded me that mistakes can bring people closer. It was a heartwarming moment that gave me a sense of belonging."],
["Describe a time you felt lonely.", ["When it was", "Where you were", "What you did", "Explain how it changed"], "inter", "I felt lonely during my first month in a new city. I had moved for work and didn't know anyone. After work, I would return to my small apartment and eat dinner alone. I decided to be proactive and joined a weekend running group. Slowly, I met people with similar interests, and my loneliness faded. Looking back, I'm glad I pushed myself to take the first step. It taught me that connection requires effort. In the end, it was a blessing in disguise that left a lasting impression on me. It gave me firsthand insight into how others live, and I try to make the most of every similar chance."],
["Describe a good habit that you have.", ["What the habit is", "When you started it", "How you maintain it", "Explain how it benefits you"], "easy", "One good habit I have is reading for twenty minutes before bed. I started it two years ago when I realized I was spending too much time on my phone at night. I keep a book on my pillow so I never forget. Reading helps me relax, and I fall asleep more easily. It has also improved my vocabulary and concentration. I enjoy this routine so much that I look forward to it every evening."],
["Describe a time when you saw something beautiful.", ["What you saw", "Where you were", "Who you were with", "Explain why it was beautiful"], "easy", "I saw a breathtaking sunset over Ha Long Bay during a boat trip. The sky turned shades of orange and purple, and the limestone islands appeared as dark silhouettes. Everyone on the boat fell silent and simply watched. The water was calm, reflecting the colors like a mirror. I felt a deep sense of peace and wonder. It was beautiful because it was natural, simple and fleeting. I took a few photos, but they never capture the real feeling."],
["Describe a time when you lost something.", ["What you lost", "Where you lost it", "What you did", "Explain how you felt"], "easy", "I lost my keys on the way home from work one evening. I searched my bag several times, then retraced my steps to the café where I'd stopped. The staff hadn't seen them, and I started to feel anxious. Finally, I called my roommate, who came to let me in. The next day, someone returned the keys to the café. I felt grateful and a bit foolish. Since then, I attach a bright keychain to make them easier to find. It was a thought-provoking lesson that helped me expand my horizons."],
["Describe a time when you disagreed with a friend.", ["What you disagreed about", "When it happened", "How you solved it", "Explain how you felt afterwards"], "inter", "I disagreed with a close friend about how to split the cost of a trip. She wanted to divide everything equally, while I thought we should pay according to what each of us used. The discussion became tense, and we stopped talking for a day. Eventually, I realized that our friendship mattered more than a few dollars. I called her, apologized for my tone and suggested a compromise. We agreed to share major costs equally and pay for personal expenses separately. I felt relieved that we resolved it calmly. Looking back, it was an eye-opening experience that broadened my horizons. I still have fond memories of it, and it gave me a real sense of achievement."],
["Describe a time you enjoyed a long walk.", ["Where you walked", "Who you were with", "How long you walked", "Explain why you enjoyed it"], "easy", "I once walked along the coast of Quy Nhon with my sister for about three hours. We started in the early morning, when the air was still cool. The path wound through fishing villages and quiet beaches. We stopped for coconut water and chatted about our childhood. The walk was tiring, but the sea breeze and the scenery kept us energized. I enjoyed it because we had no schedule and no distractions. It was a perfect way to spend time together. It was a steep learning curve, but it boosted my confidence for the future."],
["Describe a time when you learned something useful from the internet.", ["What you learned", "Which website or video you used", "When it was", "Explain how it helped you"], "easy", "Last year, I learned how to repair a leaking faucet by watching a video tutorial. I was reluctant to call a plumber because it was expensive. The video explained each step clearly, and I followed along with a wrench and a new rubber washer. After half an hour, the leak was gone. I felt proud and saved a lot of money. This experience encouraged me to try other do-it-yourself repairs at home."],
["Describe a person who works in a job you would like to do.", ["Who the person is", "What their job is", "How you know them", "Explain why you'd like to do that job"], "inter", "I would like to be a travel journalist like my friend Hanh. She writes articles about cultural destinations and takes her own photographs. I admire how she turns her curiosity into a career, and she has visited more than twenty countries. Her job requires adaptability, strong storytelling skills and a lot of energy. I'd like to follow her path because I enjoy writing and discovering new places. Although it can be tiring and uncertain, I think the rewards outweigh the difficulties. She has inspired me to start my own travel blog."],
["Describe a time when you were praised for something.", ["What you did", "Who praised you", "When it happened", "Explain how you felt"], "easy", "My manager praised me in front of the whole team for finishing a difficult report ahead of schedule. I had stayed late for several days to double-check the figures. When she mentioned my effort during the meeting, I felt my cheeks turn red. I was embarrassed but also proud that my hard work was noticed. The praise motivated me to keep a high standard. It reminded me how powerful recognition can be."],
["Describe a time you tried to be more active.", ["What you did", "Why you wanted to be active", "How you kept going", "Explain what the result was"], "inter", "Two years ago, I realized I was sitting at a desk for more than ten hours a day. My back often hurt, and I felt tired all the time. I decided to take the stairs, walk during lunch breaks and join a weekend cycling club. Initially, it was difficult to stay consistent, but I tracked my steps and set small goals. After three months, I felt stronger and had more energy. The habit has stuck with me ever since. It improved both my physical health and my mood. Even now, remembering that moment gives me peace of mind. It was a heartwarming moment that gave me a sense of belonging."],
["Describe a time when you were in a hurry.", ["Where you were going", "Why you were in a hurry", "What happened", "Explain what you learned"], "easy", "I once overslept on the day of an important exam. I jumped out of bed, grabbed my bag and ran to the bus stop. The bus was late, so I took a motorbike taxi and arrived with five minutes to spare. I was sweating and out of breath, but I made it. During the exam, I couldn't concentrate at first because my heart was racing. Luckily, I calmed down and finished all the questions. After that day, I set two alarms every night. In the end, it was a blessing in disguise that left a lasting impression on me."],
];

["Do you prefer traveling alone or with others?", "inter", "I prefer traveling with others.", "It's more enjoyable to share experiences with someone.", "For example, my last trip with friends created great memories. I've recommended it to a few people, and most of them agree. I try to make time for it no matter how packed my schedule gets.", "So I usually choose to travel in company. I've picked up on how much it actually helps, even on ordinary days."],
["What is your dream destination?", "easy", "My dream destination is Japan.", "I'm fascinated by its mix of tradition and modern life.", "For example, I'd love to see both Tokyo and Kyoto. It's genuinely one of the more reliable parts of my routine. It's not something I'd give up easily, even when things get busy.", "So it's at the top of my travel list. It's a nice way to break up the routine every once in a while."],
["Do you prefer city trips or nature trips?", "inter", "I prefer nature trips.", "They help me disconnect and relax more fully.", "For example, I felt much calmer after a recent mountain trip. Over time, it's become less of a choice and more of a habit. Looking back, it's one of the few habits that's genuinely stuck with me.", "So nature destinations appeal to me more than cities. I try not to take it for granted, even though it's become so familiar."],
["How do you usually plan your trips?", "inter", "I usually plan trips a few weeks in advance.", "This gives me time to research and book things.", "For example, I compare hotel prices before making a decision. That's probably the closest thing I have to a daily ritual. It doesn't take much effort, but it makes a noticeable difference to my mood.", "So a bit of planning helps the trip go smoothly. It's something I look forward to, even on days when I'm short on time."],
["What do you usually bring with you when you travel?", "easy", "I usually bring a camera and comfortable shoes.", "They're essential for exploring and capturing memories.", "For example, I took hundreds of photos on my last trip. It's a preference I've had for years, and it hasn't really faded. I've picked it up so consistently that friends now associate it with me.", "So these two items are always in my bag. It's stuck with me longer than most habits usually do."],
["Would you like to travel more in the future?", "easy", "Yes, I'd definitely like to travel more.", "There are still many places I haven't explored.", "For example, I'm planning to visit a new country next year. I suspect most people have something similar, even if they don't talk about it. It's become a dependable way to recharge before diving back into work.", "So traveling more is one of my future goals. Honestly, it helps me keep things in perspective when life gets busy."],
["What is the best piece of advice you have ever received?", "easy", "The best advice I've received is to focus on progress rather than perfection.", "It helps me avoid procrastinating when a task feels too big.", "For example, when I started learning English, a teacher told me to practice a little every day. That small habit has paid off over time and I've picked up new words without even noticing.", "So that advice has become my guiding principle. It still keeps me going when I feel stuck."],
["Do you prefer cooking at home or ordering delivery?", "easy", "I prefer cooking at home most of the time.", "It's healthier, and it's also a nice way to wind down after work.", "For example, I often cook a simple soup or stir-fry on weekdays. Occasionally I order delivery when I'm swamped, but it never tastes as fresh.", "So home cooking wins for me. It's a small routine that I genuinely look forward to."],
["What is something small that instantly improves your mood?", "easy", "A cup of good coffee instantly lifts my mood.", "The smell and the warmth make me feel calm and ready to start the day.", "For instance, on a hectic morning I take five minutes to sit by the window with my coffee. It sounds trivial, but it really helps me recharge.", "So it's a tiny ritual that makes a big difference. I'd hate to give it up."],
["Do you think it's better to rent or to buy a home?", "inter", "I think it depends on your stage of life, but renting is more practical for young people.", "Property prices are so high that a down payment can take years to save up.", "For example, many of my friends rent in the city so they can stay flexible for work. They'd rather put money into travel and skills than tie themselves down with a mortgage.", "In the long run, buying makes sense once you're settled. Until then, renting offers real peace of mind."],
["What is your favorite way to explore a new city?", "easy", "My favorite way is to wander on foot without a strict plan.", "You stumble upon hidden cafés and local markets that guidebooks never mention.", "For example, on my last trip I got lost in a side street and discovered a tiny bakery full of locals. That unplanned detour ended up being the highlight of the trip.", "So I always leave some free time for spontaneous exploring. It gives a city its real character."],
["How do you usually deal with stress?", "inter", "I try to step back and take a short break whenever I feel overwhelmed.", "Stress tends to snowball if I keep pushing through without pausing.", "For example, I go for a walk or listen to music for twenty minutes, and then I tackle the problem with a clearer head. Talking to a friend also helps me put things in perspective.", "So the key for me is not to bottle things up. A little downtime goes a long way."],
["Do you enjoy going to coffee shops to work or study?", "easy", "Yes, I find coffee shops a great place to focus.", "The background buzz keeps me motivated, and I'm less tempted to procrastinate.", "For example, I can finish a report in two hours at a café, whereas at home I'd get distracted by chores. The only downside is that it can get crowded.", "So I go to cafés whenever I need to get things done. It's become a reliable routine."],
["What is a habit you've picked up recently?", "easy", "I've recently started journaling before bed.", "It helps me clear my mind and reflect on what went well during the day.", "For example, I write down three things I'm grateful for. It only takes five minutes, but I've noticed I fall asleep much more easily.", "So it's a simple habit that has really grown on me. I plan to stick with it."],
["Do you think people rely too much on GPS and maps?", "inter", "Yes, I think many of us have become overly dependent on navigation apps.", "We stop paying attention to our surroundings, so our sense of direction gets weaker.", "For example, my cousin can't find his way around his own neighborhood without his phone. On the other hand, GPS is a lifesaver when you're in an unfamiliar place or running late.", "So it's a double-edged sword. The trick is to use it as a tool, not a crutch."],
["What would you do with an unexpected free day?", "easy", "I'd spend it doing something relaxing and a little spontaneous.", "I rarely get a day with no obligations, so I'd want to make the most of it.", "For example, I might sleep in, have a long brunch and then catch a movie. If the weather is nice, I'd head to the park with a book.", "So a free day would be all about recharging. I'd feel completely refreshed afterwards."],
["Do you prefer small gatherings or big parties?", "easy", "I definitely prefer small gatherings.", "You can have real conversations instead of shouting over loud music.", "For example, last weekend I had dinner with four close friends, and we chatted for hours. At big parties, I tend to feel a bit drained after a while.", "So small groups suit my personality better. It's more cozy and meaningful."],
["What do you think makes a good boss?", "inter", "A good boss communicates clearly and trusts the team to do their job.", "People perform better when they feel respected rather than micromanaged.", "For example, my former manager always gave constructive feedback and took the time to explain priorities. As a result, everyone felt motivated and accountable.", "So I'd say empathy and transparency matter most. Those qualities make a team stick together."],
["Have you ever tried to learn a musical instrument?", "easy", "Yes, I tried learning the guitar a few years ago.", "I've always loved music, and I wanted to play my favorite songs.", "For example, I practiced chords for half an hour every evening. Unfortunately, I lost momentum when work got busy, and I never got past the basics.", "So I'd love to pick it up again someday. It's still on my bucket list."],
["Is it important to save money from a young age?", "inter", "Yes, I think building the habit early is incredibly valuable.", "Even small amounts add up over time thanks to compound interest, and you're better prepared for emergencies.", "For example, a friend of mine started putting aside ten percent of her first salary. A few years later, she had enough to cover a down payment on a flat.", "So the earlier you start, the less stressful your finances become. It's one of the smartest habits to develop."],
["What is your favorite local dish that visitors should try?", "easy", "I'd recommend bún chả to anyone visiting Vietnam.", "It's flavorful, filling and a great example of how simple ingredients can create something special.", "For example, the grilled pork, fresh herbs and dipping sauce go together perfectly. I always take my foreign friends to a small family-run place that's been around for decades.", "So it's a must-try dish. It really captures the spirit of local cuisine."],
];

  pressure:"áp lực", limited:"hạn chế", safety:"an toàn", planning:"việc lập kế hoạch", access:"sự tiếp cận", personal:"cá nhân", significant:"đáng kể", gradually:"dần dần", despite:"mặc dù",
  eventually:"cuối cùng", previous:"trước đó", consent:"sự đồng ý", priority:"ưu tiên", relax:"thư giãn",
};
const VOCAB_VN = Object.assign({}, GENERIC_VN, SPECIFIC_VN);
function highlightVN(text, max, strict){
  max = max || 4;
  const premiumWords = Object.keys(PREMIUM_VN).sort((a,b)=>b.length-a.length);
  const specificWords = Object.keys(SPECIFIC_VN).sort((a,b)=>b.length-a.length);
  const genericWords = Object.keys(GENERIC_VN).sort((a,b)=>b.length-a.length);
  const premiumRegex = new RegExp('\\b(' + premiumWords.join('|') + ')\\b', 'gi');
  const specificRegex = new RegExp('\\b(' + specificWords.join('|') + ')\\b', 'gi');
  const genericRegex = new RegExp('\\b(' + genericWords.join('|') + ')\\b', 'gi');

  const seen = new Set();
  let count = 0;

  // Pass 1: prioritize genuinely rare/impressive B1-C1 vocabulary
  let result = text.replace(premiumRegex, (match)=>{
    const key = match.toLowerCase();
    if(seen.has(key) || count >= max) return match;
    seen.add(key); count++;
    return `<mark class="vn-highlight">${match}<span class="vn-def">${PREMIUM_VN[key]}</span></mark>`;
  });

  // Pass 2: fill remaining slots with topic-specific vocabulary
  if(count < max){
    result = result.replace(specificRegex, (match)=>{
      const key = match.toLowerCase();
      if(seen.has(key) || count >= max) return match;
      seen.add(key); count++;
      return `<mark class="vn-highlight">${match}<span class="vn-def">${SPECIFIC_VN[key]}</span></mark>`;
    });
  }

  // Pass 3: only fill remaining slots with generic connector words if needed
  // (skipped entirely in strict mode, e.g. Role Play, to avoid highlighting common words)
  if(count < max && !strict){
    result = result.replace(genericRegex, (match)=>{
      const key = match.toLowerCase();
      if(seen.has(key) || count >= max) return match;
      seen.add(key); count++;
      return `<mark class="vn-highlight">${match}<span class="vn-def">${GENERIC_VN[key]}</span></mark>`;
    });
  }
  return result;
}

function makeBag(len){
  const arr=[...Array(len).keys()];
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

const FILTERS = {
  social:{ options:[['easy','Easy','#4CAF50'],['inter','Intermediate','#F5A926']], test:(item,val)=>item[2]===val },
  ielts:{ options:[['easy','Easy','#4CAF50'],['inter','Intermediate','#F5A926']], test:(item,val)=>item[2]===val },
  roleplay:{ options:[['2','2 People','#5B9BEE'],['3','3 People','#3FA7A0']], test:(item,val)=>String(item[1].length)===val },
  question:{ options:[['easy','Easy','#4CAF50'],['inter','Intermediate','#F5A926']], test:(item,val)=>item[1]===val },
  vocab:{ options:[['easy','Easy','#4CAF50'],['inter','Intermediate','#F5A926']], test:(pattern,val)=>pattern.compat.some(w => WORD_MAP[w] && WORD_MAP[w][3]===val) },
};

const decks = {
  social:{ data: SOCIAL, level:'easy', pool:[], bag:[], drawn: 0 },
  ielts:{ data: IELTS, level:'easy', pool:[], bag:[], drawn: 0 },
  roleplay:{ data: ROLEPLAY, level:'2', pool:[], bag:[], drawn: 0 },
  question:{ data: QUESTIONS, level:'easy', pool:[], bag:[], drawn: 0 },
  vocab:{ data: GRAMMAR, level:'easy', pool:[], bag:[], drawn: 0 },
};

function rebuildPool(deckKey){
  const d = decks[deckKey];
  const f = FILTERS[deckKey];
  d.pool = d.data.filter(item=>f.test(item, d.level));
  d.bag = makeBag(d.pool.length);
  d.drawn = 0;
}
Object.keys(decks).forEach(rebuildPool);

const titles = {

  // counter display removed — deck progress is still tracked internally via decks[tab].drawn

function nextIndex(deckKey){
  const d = decks[deckKey];
  if(d.bag.length === 0){
    d.bag = makeBag(d.pool.length);
    d.drawn = 0;
  }
  d.drawn++;
  return d.bag.pop();
}


function splitSocialAnswer(text){
  // Split into sentences (basic, works fine for our clean text)
  const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
  const overallIdx = sentences.findIndex(s => /\bOverall\b/.test(s));
  let answerPart, detailPart, overallPart;
  if(overallIdx === -1){
    // Fallback: no "Overall" found, just split first sentence vs rest
    answerPart = sentences[0] || text;
    detailPart = sentences.slice(1).join(' ').trim();
    overallPart = '';
  } else {
    answerPart = sentences[0] || '';
    detailPart = sentences.slice(1, overallIdx).join(' ').trim();
    overallPart = sentences.slice(overallIdx).join(' ').trim();
  }
  const parts = [['ANSWER', answerPart.trim()]];
  if(detailPart) parts.push(['DETAIL', detailPart]);
  if(overallPart) parts.push(['OVERALL', overallPart]);
  return parts;
}

function renderSocial(){
  const idx = nextIndex('social');
  const pool = decks.social.pool;
  const [topic, tag, level, answer] = pool[idx];
  const parts = splitSocialAnswer(answer);
  ticketEl.innerHTML = `

      ${parts.map(([tag,text])=>`<div class="prep-line"><span class="prep-tag">${tag}</span><span class="prep-text">${highlightVN(text, 8)}</span></div>`).join('')}

  `;
}

function renderIelts(){
  const idx = nextIndex('ielts');

  const [topic, hints, level, example] = pool[idx];
  ticketEl.innerHTML = `
    <div class="ticket-top">
      <span class="ticket-no">No. ${String(idx+1).padStart(3,'0')} / ${pool.length}</span>
    </div>
    <p class="ticket-topic">${topic}</p>
    <div style="font-family:'Nunito',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.05em;color:var(--blue-deep);text-transform:uppercase;margin-bottom:8px;">You should say:</div>
    <ul class="hints">${hints.map(h=>`<li>${h}</li>`).join('')}</ul>
    ${example ? `
    <button class="gram-ex-toggle" style="display:block;margin:16px auto 0;" onclick="const w=this.nextElementSibling; w.classList.toggle('show'); this.textContent = w.classList.contains('show') ? 'Hide example' : 'Show example';">Show example</button>
    <div class="gram-ex-wrap"><span class="gram-ex">${highlightVN(example, 8)}</span></div>
    ` : ''}
  `;
}

const ROUND_POOLS = [
  ["Honestly, that's a really good point.","Yeah, I hadn't thought about it that way before.","True, but I guess it depends on the situation.","That makes sense, I see what you mean.","Fair enough, I can't really argue with that.","Exactly, that's basically how I see it too.","Good point, I hadn't considered that angle."],
  ["Anyway, what do you think we should do next?","So, are we still on for later?","By the way, have you told anyone else about this?","What time works best for you then?","Should we loop in anyone else, or just keep it between us?","Is there anything else we should sort out before then?","So what's the plan from here then?"],
  ["Alright, sounds like a plan then.","Great, I'll see you soon!","Perfect, talk to you later.","Okay, I'm looking forward to it.","Sounds good, catch you later then.","Awesome, this was a good chat.","Great, let's do this then."],
  ["Oh, and one more thing before I forget!","Actually, that reminds me of something else.","Wait, before you go — one quick thing.","Oh, speaking of which, I almost forgot to mention something.","Hang on, there's actually one more thing.","By the way, I meant to ask you something else too.","Oh right, I almost forgot to bring this up."],
  ["Sure, what's up?","Oh yeah? Go for it.","Haha, of course, what is it?","Sure thing, I'm listening.","Go ahead, I've got a minute.","Oh no, what is it now?","Sure, what's on your mind?"],
  ["Alright, I really should get going now.","Okay, take care, talk soon!","Right, I'll let you go then.","Anyway, have a good one!","Okay, see you around!","Take it easy, bye for now!","Alright, catch you later for real this time."],
];
function shuffledPick(pool, n){
  const bag = makeBag(pool.length);
  return bag.slice(0, n).map(i => pool[i]);
}

function renderRoleplay(){
  const idx = nextIndex('roleplay');
  const pool = decks.roleplay.pool;
  const [theme, roles, example] = pool[idx];
  const roundPicks = ROUND_POOLS.map(p => shuffledPick(p, roles.length));
  const script = [];
  for(let round=0; round<9; round++){
    example.forEach((triple,i)=>{
      const line = round < 3 ? triple[round] : roundPicks[round-3][i];
      script.push([i, line]);
    });
  }
  ticketEl.innerHTML = `
    <div class="ticket-top">
      <span class="ticket-tag">ROLE PLAY · ${roles.length} PEOPLE</span>
      <span class="ticket-no">No. ${String(idx+1).padStart(3,'0')} / ${pool.length}</span>
    </div>
    <p class="ticket-topic">${theme}</p>
    <ul class="roles">${roles.map((r,i)=>{
      const parts = r.split(/:(.+)/);
      return `<li class="role-item"><span class="role-badge b${i%3}">${String.fromCharCode(65+i)}</span><span class="role-text"><strong>${parts[0]}:</strong>${parts[1]||''}</span></li>`;
    }).join('')}</ul>
    <button class="gram-ex-toggle" style="display:block;margin:12px auto 0;" onclick="const w=this.nextElementSibling; w.classList.toggle('show'); this.textContent = w.classList.contains('show') ? 'Hide example' : 'Show example';">Show example</button>
    <div class="gram-ex-wrap script-scroll">${script.map(([i,line])=>
      `<div class="script-line"><span class="role-badge b${i%3}">${String.fromCharCode(65+i)}</span><span class="script-text">${highlightVN(line, 1, true)}</span></div>`
    ).join('')}</div>
  `;
}

const ANSWER_FORMATS = [
  { name:"PREP", label:"Answer using the PREP structure",
    build:(point,reason,example,point2)=>[["Point",point],["Reason",reason],["Example",example],["Point",point2]] },
  { name:"Direct", label:"Give a direct answer, then explain",
    build:(point,reason,example,point2)=>[["Answer",point],["Because",reason],["For example",example]] },
  { name:"Concise", label:"Keep it short: answer + example",
    build:(point,reason,example,point2)=>[["Answer",point],["For example",example]] },
  { name:"Reason-first", label:"Lead with your reason, then answer",
    build:(point,reason,example,point2)=>[["Well",reason],["So",point],["For example",example]] },
];

function renderQuestion(){
  const idx = nextIndex('question');
  const pool = decks.question.pool;
  const [q, level, point, reason, example, point2] = pool[idx];
  const exampleNoLeadIn = example.replace(/^For (example|instance),\s*/i, '').replace(/^./, c=>c.toUpperCase());
  const format = ANSWER_FORMATS[Math.floor(Math.random()*ANSWER_FORMATS.length)];
  const parts = format.build(point,reason,exampleNoLeadIn,point2);
  ticketEl.innerHTML = `
    <div class="ticket-top">
      <span class="ticket-no">No. ${String(idx+1).padStart(3,'0')} / ${pool.length}</span>
    </div>
    <p class="ticket-topic">${q}</p>
    <button class="gram-ex-toggle" style="display:block;margin:22px auto 0;" onclick="const w=this.nextElementSibling; w.classList.toggle('show'); this.textContent = w.classList.contains('show') ? 'Hide example' : 'Show example';">Show example</button>
    <div class="gram-ex-wrap">
      ${parts.map(([tag,text])=>`<div class="prep-line"><span class="prep-tag">${tag}</span><span class="prep-text">${highlightVN(text, 2, true)}</span></div>`).join('')}
    </div>
  `;
}

function renderVocab(){
  const idx = nextIndex('vocab');
  const pool = decks.vocab.pool;
  const pattern = pool[idx];
  const level = decks.vocab.level;
  const candidates = pattern.compat.filter(w => WORD_MAP[w] && WORD_MAP[w][3] === level);
  const wordList = candidates.length ? candidates : pattern.compat;
  const [word, pos, meaning] = WORD_MAP[wordList[Math.floor(Math.random()*wordList.length)]];
  const bucket = posBucket(pos);
  const gEx = pattern[bucket](word);
  ticketEl.innerHTML = `
    <div class="ticket-top">
      <span class="ticket-tag">B1 · WORD + GRAMMAR</span>
      <span class="ticket-no">No. ${String(idx+1).padStart(3,'0')} / ${pool.length}</span>
    </div>
    <div class="word-row">
      <span class="word">${word}</span>
      <span class="pos">${pos}</span>
    </div>
    <p class="meaning">${meaning}</p>
    <div class="gram-block">
      <div class="gram-title">${pattern.title}</div>
      <div class="gram-formula">${pattern.formula}</div>
      <div class="gram-task">✏️ Make a new sentence using <strong>"${word}"</strong> + this structure</div>
      <button class="gram-ex-toggle" onclick="const w=this.nextElementSibling; w.classList.toggle('show'); this.textContent = w.classList.contains('show') ? 'Hide example' : 'Show example';">Show example</button>
      <div class="gram-ex-wrap"><span class="gram-ex">e.g. ${gEx}</span></div>
    </div>
  `;
}

const renderers = { social: renderSocial, ielts: renderIelts, roleplay: renderRoleplay, question: renderQuestion, vocab: renderVocab };

const timerBtn = document.getElementById('timerBtn');
let timerInterval = null;
let timerSeconds = 0;

function stopTimer(){
  clearInterval(timerInterval);
  timerInterval = null;
  timerBtn.classList.remove('running');
  timerBtn.textContent = '⏱';
  timerSeconds = 0;
}
function startTimer(){
  clearInterval(timerInterval);
  timerSeconds = 0;
  timerBtn.classList.add('running');
  timerBtn.textContent = '0:00';
  timerInterval = setInterval(()=>{
    timerSeconds++;
    const m = Math.floor(timerSeconds/60);
    const s = String(timerSeconds%60).padStart(2,'0');
    timerBtn.textContent = `${m}:${s}`;
  }, 1000);
}
timerBtn.addEventListener('click', ()=>{
  if(timerInterval) stopTimer(); else startTimer();
});

drawBtn.addEventListener('click', ()=>{
  drawBtn.classList.remove('spin');
  void drawBtn.offsetWidth;
  drawBtn.classList.add('spin');
  ticketEl.classList.remove('show');
  placeholderEl.style.display = 'none';
  renderers[currentTab]();
  void ticketEl.offsetWidth;
  ticketEl.classList.add('show');
  updateCounter();
  startTimer();
});

tabTipEl.textContent = TIPS[currentTab];
renderLevelRow();
updateCounter();
