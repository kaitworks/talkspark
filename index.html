<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalkSpark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EAF4FE;
    --panel:#FFFFFF;
    --panel-line:#DCEEFB;
    --yellow:#FFCB4D;
    --yellow-deep:#F5A926;
    --blue:#5B9BEE;
    --blue-deep:#2F6FBF;
    --ink:#1E3A5F;
    --muted:#8CA6C2;
    --muted-light:#4A6E96;
    --paper:#FFFDF6;
    --paper-edge:#FFE4A0;
    --text-body:#3A5470;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 15% -10%, #FFF3D2 0%, transparent 55%),
      radial-gradient(ellipse at 100% 110%, #B9DBFF 0%, transparent 65%),
      var(--bg);
    min-height:100vh;
    font-family:'Nunito',sans-serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:40px 16px;
  }
  .wrap{width:100%;max-width:1320px;}
  .layout{display:flex;gap:40px;align-items:stretch;}
  .left-col{flex:0 0 290px;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;}
  .right-col{flex:1;min-width:0;}

  /* ---------- Header ---------- */
  header{text-align:center;position:relative;}
  .eyebrow{
    font-family:'Nunito',sans-serif;font-weight:800;
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--blue-deep);margin-bottom:10px;
  }
  h1{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:clamp(42px,6.2vw,64px);
    line-height:1.0;
    margin:0 0 24px;
    color:var(--ink);
    overflow-wrap:break-word;
  }
  h1 em{color:var(--blue-deep);font-style:normal;}
  .sub-line{
    display:flex;align-items:center;gap:10px;
    color:var(--blue-deep);font-size:19px;font-weight:800;
    max-width:270px;margin:0 auto 8px;line-height:1.3;
  }
  .sub-num{
    flex-shrink:0;width:24px;height:24px;border-radius:50%;
    background:var(--yellow);color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:13px;
  }

  /* ---------- Title decoration ---------- */
  .spark-wrap{position:relative;display:inline-block;}
  .underline-svg{
    position:absolute;left:2px;bottom:-12px;width:100%;height:18px;
    pointer-events:none;
  }
  .spark-icon{
    position:absolute;
    font-size:20px;line-height:1;
    color:var(--yellow-deep);
    pointer-events:none;
    user-select:none;
  }
  .spark-icon-1{top:-10px;right:-30px;font-size:28px;transform:rotate(8deg);}
  .spark-icon-2{top:10px;right:28px;color:var(--blue);font-size:20px;opacity:.7;}
  .spark-icon-3{bottom:80px;left:0px;color:var(--yellow-deep);font-size:18px;opacity:.6;}
  .spark-icon-4{top:-36px;left:20px;color:var(--blue);font-size:16px;opacity:.55;}
  .spark-icon-5{bottom:20px;right:-10px;color:var(--yellow-deep);font-size:15px;opacity:.5;}
  .spark-icon-6{top:40%;left:-34px;color:var(--blue);font-size:14px;opacity:.4;}

  .amb{position:absolute;pointer-events:none;user-select:none;}
  .amb-1{top:6%;left:18%;font-size:15px;color:var(--blue);opacity:.45;}
  .amb-2{top:14%;right:8%;font-size:12px;color:var(--yellow-deep);opacity:.5;}
  .amb-3{bottom:14%;left:6%;font-size:13px;color:var(--yellow-deep);opacity:.4;}
  .amb-4{bottom:20%;right:16%;font-size:16px;color:var(--blue);opacity:.4;}
  .amb-5{top:38%;left:2%;font-size:11px;color:var(--blue);opacity:.35;}
  .amb-6{bottom:6%;right:30%;font-size:12px;color:var(--yellow-deep);opacity:.35;}

  @media (max-width:460px){
    .layout{flex-direction:column;gap:20px;}
    .left-col{flex:none;}
    h1{font-size:clamp(36px,10vw,52px);}
    .sub-line{max-width:420px;font-size:16px;}
  }

  /* ---------- Tabs (pill capsule) ---------- */
  .tabs{
    display:flex;flex-wrap:nowrap;gap:6px;
    background:#EDEDED;
    padding:9px;border-radius:24px;
    margin-bottom:28px;
  }
  .tab{
    flex:1 1 0;
    min-width:0;
    background:transparent;
    border:none;
    border-radius:18px;
    padding:15px 10px;
    text-align:center;
    cursor:pointer;
    font-family:'Nunito',sans-serif;
    font-weight:800;
    font-size:16px;
    color:var(--muted-light);
    letter-spacing:.01em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    transition:all .18s ease;
    user-select:none;
  }
  .tab:hover{color:var(--ink);}
  .tab.active{
    background:var(--panel);
    color:var(--ink);
    box-shadow:0 3px 10px -4px rgba(30,58,95,0.25);
  }

  /* ---------- Machine panel ---------- */
  .machine{
    background:var(--panel);
    border-radius:30px;
    padding:36px 32px 32px;
    box-shadow:inset 0 0 0 1px var(--panel-line), 0 24px 50px -28px rgba(47,111,191,0.35);
  }
  .machine-head{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:26px;gap:10px;
  }
  .machine-title{
    font-family:'Baloo 2',sans-serif;font-weight:600;font-size:19px;color:var(--ink);
  }
  .machine-title .dot{color:var(--blue-deep);margin-right:6px;}
  .tab-tip{
    font-family:'Nunito',sans-serif;font-weight:700;font-size:13.5px;
    color:#1A4A85;margin:8px 0 18px;line-height:1.5;
    display:flex;align-items:flex-start;gap:6px;
    background:rgba(91,155,238,0.14);
    border:1.5px dashed rgba(47,111,191,0.55);
    border-radius:12px;
    padding:10px 14px;
  }

  /* ---------- Ticket ---------- */
  .stage{
    position:relative;
    min-height:340px;
    display:flex;align-items:center;justify-content:center;
    perspective:1200px;
    margin-bottom:28px;
    border-top:1.5px dashed var(--panel-line);
    border-bottom:1.5px dashed var(--panel-line);
  }
  .placeholder{
    text-align:center;color:var(--muted);font-size:16px;font-weight:700;line-height:1.7;
    padding:30px 20px;
  }
  .placeholder .cap{display:block;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--yellow-deep);margin-bottom:14px;opacity:.8;}
  .placeholder .big{display:block;font-size:40px;margin-bottom:14px;}

  .ticket{
    display:none;
    position:relative;
    width:100%;
    background:var(--paper);
    color:var(--ink);
    border-radius:18px;
    padding:22px 22px 20px;
    animation:draw .5s cubic-bezier(.2,.8,.25,1);
    box-shadow:0 18px 40px -18px rgba(47,111,191,0.4);
  }
  .ticket.show{display:block;}
  @keyframes draw{
    0%{opacity:0;transform:translateY(18px) rotate(-2.5deg) scale(.96);}
    60%{opacity:1;}
    100%{opacity:1;transform:translateY(0) rotate(0) scale(1);}
  }
  .ticket::before,.ticket::after{
    content:"";position:absolute;top:50%;width:22px;height:22px;
    background:var(--panel);border-radius:50%;transform:translateY(-50%);
  }
  .ticket::before{left:-11px;}
  .ticket::after{right:-11px;}
  .perf{
    position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;
  }
  .ticket-top{
    display:flex;justify-content:space-between;align-items:flex-start;
    border-bottom:1.5px dashed var(--paper-edge);
    padding-bottom:12px;margin-bottom:14px;
  }
  .ticket-tag{
    font-family:'Nunito',sans-serif;font-size:10.5px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--blue-deep);font-weight:700;
    background:rgba(91,155,238,0.12);padding:4px 9px;border-radius:6px;
  }
  .ticket-no{
    font-family:'Nunito',sans-serif;font-weight:700;font-size:11px;color:var(--muted);
  }
  .ticket-topic{
    font-family:'Baloo 2',sans-serif;font-weight:600;font-size:27px;line-height:1.32;
    margin:0 0 16px;
  }
  .hints{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;}
  .hints li{
    font-size:16.5px;font-weight:600;line-height:1.5;color:var(--text-body);
    padding-left:20px;position:relative;
  }
  .hints li::before{
    content:"–";position:absolute;left:0;color:var(--blue-deep);font-weight:800;
  }
  .word-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
  .word{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:34px;}
  .pos{font-family:'Nunito',sans-serif;font-size:13px;color:var(--blue-deep);font-weight:700;}
  .meaning{font-size:17px;font-weight:600;color:var(--text-body);margin-bottom:16px;}
  .gram-block{
    background:rgba(91,155,238,0.07);border:1px dashed var(--paper-edge);
    border-radius:12px;padding:12px 14px;
  }
  .gram-title{
    font-family:'Nunito',sans-serif;font-weight:700;font-size:12.5px;
    color:var(--blue-deep);text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px;
  }
  .gram-formula{
    font-family:'Baloo 2',sans-serif;font-weight:600;font-size:15px;
    color:var(--ink);line-height:1.5;margin-bottom:8px;
  }
  .gram-desc{font-size:13.5px;color:var(--text-body);line-height:1.55;}
  .gram-ex{font-family:'Nunito',sans-serif;font-weight:700;font-size:12.5px;color:#5B7593;}
  .vn-highlight{
    background:rgba(245,169,38,0.25);
    padding:1px 4px;border-radius:5px;
    font-weight:800;color:var(--ink);
    -webkit-box-decoration-break:clone;
    box-decoration-break:clone;
  }
  .vn-def{
    font-family:'Nunito',sans-serif;font-weight:700;font-size:11px;
    color:var(--ink);margin-left:3px;
  }
  .vn-def::before{content:"(";}
  .vn-def::after{content:")";}
  .gram-ex-toggle{
    background:linear-gradient(180deg,var(--yellow) 0%,var(--yellow-deep) 100%);
    border:none;color:var(--ink);
    font-family:'Nunito',sans-serif;font-size:12.5px;font-weight:800;
    padding:8px 18px;border-radius:999px;cursor:pointer;margin-top:2px;
    box-shadow:0 6px 14px -6px rgba(245,169,38,0.6);
    transition:transform .12s ease;
  }
  .gram-ex-toggle:hover{transform:translateY(-1px);}
  .gram-ex-wrap{display:none;margin-top:8px;}
  .script-scroll{
    max-height:260px;overflow-y:auto;
    padding-right:6px;
  }
  .script-scroll::-webkit-scrollbar{width:6px;}
  .script-scroll::-webkit-scrollbar-thumb{background:var(--panel-line);border-radius:999px;}
  .gram-ex-wrap.show{display:block;}
  .prep-line{
    display:flex;gap:8px;align-items:baseline;
    font-family:'Nunito',sans-serif;font-weight:600;font-size:13.5px;
    color:var(--text-body);line-height:1.5;margin-bottom:8px;
  }
  .prep-tag{
    flex-shrink:0;width:78px;
    font-family:'Nunito',sans-serif;font-weight:700;font-size:10.5px;
    letter-spacing:.03em;text-transform:uppercase;color:var(--blue-deep);
  }
  .prep-text{flex:1;min-width:0;}
  .phrase-block{margin-bottom:10px;}
  .gram-task{
    display:flex;align-items:center;gap:6px;
    font-family:'Nunito',sans-serif;font-weight:700;font-size:12px;
    color:var(--blue-deep);margin-top:12px;padding-top:10px;
    border-top:1px dashed var(--paper-edge);
  }

  /* ---------- Role play ---------- */
  .roles{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
  .role-item{display:flex;gap:10px;align-items:flex-start;}
  .role-badge{
    flex-shrink:0;width:24px;height:24px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:12px;color:#fff;
    margin-top:1px;
  }
  .role-badge.b0{background:var(--blue);}
  .role-badge.b1{background:var(--yellow-deep);}
  .role-badge.b2{background:#3FA7A0;}
  .role-text{font-size:13.5px;font-weight:600;line-height:1.5;color:var(--text-body);}
  .script-line{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;}
  .script-text{font-size:13.5px;font-weight:600;line-height:1.5;color:var(--ink);padding-top:1px;}
  .role-text strong{color:var(--ink);}

  /* ---------- Level / People selector (dropdown pill) ---------- */
  .level-row{flex-shrink:0;}
  .level-select{position:relative;height:100%;}
  .level-select-btn{
    height:100%;
    display:flex;align-items:center;gap:8px;
    background:#EDEDED;
    border:1.5px solid var(--panel-line);
    border-radius:999px;
    padding:0 18px;
    cursor:pointer;
    font-family:'Nunito',sans-serif;
    font-weight:800;
    font-size:14px;
    color:var(--ink);
    white-space:nowrap;
    transition:border-color .15s ease;
  }
  .level-select-btn:hover{border-color:var(--blue);}
  .timer-btn{
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    min-width:60px;height:auto;
    background:#EDEDED;border:2px solid var(--panel-line);
    border-radius:999px;
    font-family:'Nunito',sans-serif;font-weight:800;font-size:14.5px;
    color:var(--ink);cursor:pointer;padding:0 14px;
    transition:border-color .15s ease, background .15s ease, transform .15s ease;
  }
  .timer-btn:hover{border-color:var(--blue);transform:translateY(-1px);}
  .timer-btn.running{
    background:var(--blue);border-color:var(--blue-deep);color:#fff;
    box-shadow:0 0 0 0 rgba(91,155,238,0.55);
    animation:timerPulse 1.6s ease-out infinite;
  }
  @keyframes timerPulse{
    0%{box-shadow:0 0 0 0 rgba(91,155,238,0.55);}
    70%{box-shadow:0 0 0 8px rgba(91,155,238,0);}
    100%{box-shadow:0 0 0 0 rgba(91,155,238,0);}
  }
  .level-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .level-select-btn .chevron{font-size:9px;color:var(--muted);margin-left:1px;transition:transform .15s ease;}
  .level-select.open .chevron{transform:rotate(180deg);}
  .level-menu{
    display:none;
    position:absolute;bottom:calc(100% + 8px);right:0;
    background:var(--panel);
    border:1.5px solid var(--panel-line);
    border-radius:14px;
    padding:6px;
    min-width:170px;
    box-shadow:0 16px 34px -14px rgba(30,58,95,0.4);
    z-index:10;
  }
  .level-menu.open{display:block;}
  .level-option{
    display:flex;align-items:center;gap:9px;
    padding:9px 10px;border-radius:10px;
    cursor:pointer;
    font-family:'Nunito',sans-serif;font-weight:700;font-size:12.5px;
    color:var(--ink);
    transition:background .12s ease;
  }
  .level-option:hover{background:#EDF3FA;}
  .level-option.active{background:rgba(91,155,238,0.14);color:var(--blue-deep);}

  /* ---------- Draw button ---------- */
  .draw-row{display:flex;gap:10px;align-items:stretch;justify-content:center;}
  .draw-btn{
    flex:1;
    background:linear-gradient(180deg,#FFDD85 0%,var(--yellow) 100%);
    color:var(--ink);
    border:none;border-radius:16px;
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:16px;
    padding:14px 18px;cursor:pointer;letter-spacing:.02em;
    box-shadow:0 10px 24px -10px rgba(245,169,38,0.55), inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .draw-btn:hover{transform:translateY(-2px);}
  .draw-btn:active{transform:translateY(0px) scale(.985);}
  .draw-btn.spin{animation:pulse .55s ease;}
  @keyframes pulse{0%{transform:scale(1);}50%{transform:scale(.94);}100%{transform:scale(1);}}

  footer{
    text-align:center;margin-top:22px;font-size:11px;color:var(--muted);
    font-family:'Nunito',sans-serif;font-weight:700;letter-spacing:.02em;
  }

  @media (max-width:420px){
    .tab{font-size:10px;padding:9px 3px;}
    .ticket-topic{font-size:18px;}
  }
  @media (prefers-reduced-motion: reduce){
    .ticket{animation:none;}
    .draw-btn.spin{animation:none;}
    .timer-btn.running{animation:none;}
  }

  /* ---------- Comprehensive mobile pass ---------- */
  @media (max-width:480px){
    .wrap{padding:0 4px;}
    .machine{padding:20px 16px 18px;border-radius:22px;}
    .ticket{padding:16px 16px 16px;border-radius:14px;}
    .machine-title{font-size:15px;}
    .tab-tip{font-size:12.5px;padding:9px 12px;}
    .draw-row{flex-wrap:wrap;gap:8px;}
    .draw-btn{font-size:15px;padding:12px 14px;min-width:100px;}
    .level-select-btn{font-size:13px;padding:0 14px;}
    .timer-btn{font-size:13px;min-width:52px;padding:0 10px;}
    .word{font-size:26px;}
    .ticket-topic{font-size:19px;line-height:1.3;}
    .gram-ex, .script-text, .prep-line, .hints li{font-size:13px;}
    .meaning{font-size:15px;}
    .role-badge{width:20px;height:20px;font-size:10px;}
    .vn-def{font-size:11px;max-width:140px;padding:4px 8px;}
    .vn-highlight{padding:1px 3px;}
  }
</style>
</head>
<body>
<div class="wrap">
<div class="layout">

  <div class="left-col">
    <span class="spark-icon amb amb-1">✦</span>
    <span class="spark-icon amb amb-2">✦</span>
    <span class="spark-icon amb amb-3">✦</span>
    <span class="spark-icon amb amb-4">✦</span>
    <span class="spark-icon amb amb-5">✦</span>
    <span class="spark-icon amb amb-6">✦</span>
    <header>
      <h1>Talk <span class="spark-wrap"><em>Spark</em>
        <svg class="underline-svg" viewBox="0 0 180 16" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 10 Q 45 2, 90 8 T 176 6" stroke="var(--yellow-deep)" stroke-width="6" stroke-linecap="round" fill="none"/>
        </svg>
        <span class="spark-icon spark-icon-1">✨</span>
      </span></h1>
      <span class="spark-icon spark-icon-2">✦</span>
      <span class="spark-icon spark-icon-3">✦</span>
      <span class="spark-icon spark-icon-4">✦</span>
      <span class="spark-icon spark-icon-5">✦</span>
      <span class="spark-icon spark-icon-6">✦</span>
      <div class="sub-line"><span class="sub-num">1</span>Get a random topic.</div>
      <div class="sub-line"><span class="sub-num">2</span>Speak on the spot.</div>
    </header>
  </div>

  <div class="right-col">
    <div class="tabs">
      <div class="tab active" data-tab="social">Social</div>
      <div class="tab" data-tab="question">Casual</div>
      <div class="tab" data-tab="ielts">Cue card</div>
      <div class="tab" data-tab="roleplay">Role play</div>
      <div class="tab" data-tab="vocab">Vocab</div>
    </div>

    <div class="machine">
      <div class="machine-head">
        <div class="machine-title"><span class="dot">●</span><span id="machineTitle">Social topics</span></div>
      </div>
      <div class="tab-tip" id="tabTip"></div>

      <div class="stage">
        <div class="placeholder" id="placeholder">
          <span class="cap">✦ Ready when you are ✦</span>
          <span class="big">🎟️</span>
          Your ticket will appear here
        </div>
        <div class="ticket" id="ticket"></div>
      </div>

      <div class="draw-row">
        <button class="draw-btn" id="drawBtn">Pick</button>
        <div class="level-row" id="levelRow"></div>
        <button class="timer-btn" id="timerBtn" title="Start a 60s timer">⏱</button>
      </div>
    </div>
  </div>

</div>
</div>

<script>
/* ============ DATA: 70 SOCIAL TOPICS (VN + Global) ============ */
const SOCIAL = [
["Should Vietnam ban gambling advertisements?", "vn", "easy", "I think gambling ads should be restricted, especially where children might see them. They often promote unrealistic expectations about winning money. For example, some ads target young audiences through social media and games. That said, a complete ban might just push advertising underground. Overall, I think stricter limits make more sense than a total ban. This kind of debate tends to resurface whenever circumstances shift, so opinions here will probably keep evolving. Either way, this issue is likely to spark debate for a long time to come."],
["Is it fair to charge different prices based on nationality at tourist sites?", "vn", "inter", "I don't think it's entirely fair, even though I understand the reasoning. Higher prices for foreigners are often meant to fund maintenance using local subsidies. For example, many countries use resident discounts to keep sites accessible to citizens. On the other hand, this can feel discriminatory to visitors. Overall, I think transparent pricing policies would be a better solution. What ultimately determines the outcome is usually implementation, not the underlying idea itself. Governments and communities will need to strike a balance between competing priorities."],
["Is Vietnam's education system placing too much value on English proficiency?", "vn", "inter", "I think it places significant value on English, though not necessarily too much. English opens up global opportunities for students. For example, many well-paying jobs now require strong English skills. On the other hand, this can disadvantage students in subjects like math or science. Overall, I think a more balanced curriculum would serve students better. How this plays out will likely depend heavily on local context rather than a single universal answer. If handled poorly, this could pose a threat to public trust over time."],
["Should Vietnam invest more in disaster preparedness for floods and storms?", "vn", "easy", "Yes, I think this is an increasingly urgent priority. Extreme weather events seem to be happening more frequently in recent years. For example, central Vietnam regularly faces severe flooding during storm season. That said, this requires long-term funding and planning. Overall, I think prevention is far more cost-effective than dealing with the aftermath. Progress on this front tends to be gradual, shaped more by small adjustments than dramatic reform. This kind of shift rarely happens overnight, but the direction seems clear."],
["Is it acceptable for restaurants to charge for tap water?", "global", "easy", "I don't think it's entirely acceptable, though I understand the business reasoning. Water is often seen as a basic expectation when dining out. For example, many countries provide free water as standard practice. That said, restaurants do have real costs to cover. Many diners would simply appreciate more transparency about such policies. Overall, I think a small, clearly stated charge is a fair compromise. This really highlights how personal circumstances can shape what feels like common sense to different people. This debate carries real weight because it touches so many people's daily lives."],
["Is it a problem that many young people rely on credit for everyday spending?", "global", "inter", "Yes, I think it's becoming a genuine concern. Relying on credit for daily expenses can quickly lead to debt. For example, buy-now-pay-later services have made overspending easier than ever. That said, credit can also be a useful tool when managed responsibly. Overall, I think better financial education is the real solution here. This kind of debate tends to resurface whenever circumstances shift, so opinions here will probably keep evolving. It's the kind of issue that tends to gain momentum once people start talking about it."],
["Is it necessary to regulate how AI chatbots are used in customer service?", "global", "inter", "Yes, I think some regulation is necessary as AI use grows. Customers should know when they're speaking with a chatbot rather than a person. For example, some companies now clearly label AI-assisted conversations. That said, overregulation could slow down genuinely helpful innovation. Overall, I think transparency requirements are a reasonable starting point. Public attitudes toward this seem to be gradually shifting as more real-world examples emerge. This debate could set a precedent for how similar issues get handled elsewhere."],
["Is it healthy for teenagers to have part-time jobs while studying?", "both", "inter", "I think it can be healthy in moderation. Part-time work teaches responsibility and basic financial skills early on. For example, many students learn valuable time-management skills through balancing work and school. That said, too many hours can negatively affect academic performance. Overall, I think a limited number of hours is the healthiest approach. It's the kind of issue where good intentions alone rarely guarantee a smooth outcome. This kind of change rarely comes without cost, but the trade-off feels worthwhile."],
["Is it a good idea to introduce a four-day school week nationwide?", "global", "inter", "I think it could work well if implemented thoughtfully. A shorter week could reduce student stress and improve focus. For example, some schools that have trialed it report better student wellbeing. That said, working parents might struggle with additional childcare needs. Overall, I think it's worth testing more widely before a full rollout. As with most policy questions, the details of execution tend to matter as much as the principle behind it. This issue has the potential to shed light on deeper social attitudes."],
["Should Vietnam make public restrooms more accessible in cities?", "vn", "easy", "Yes, I think this is a simple but important improvement. Many visitors and residents struggle to find clean public restrooms. For example, this is a common complaint among tourists exploring city centers. That said, maintaining these facilities requires ongoing funding and staff. Overall, I think the benefit to daily convenience makes it worthwhile. I suspect attitudes toward this will keep changing as younger generations become more influential. A well-designed policy could level the playing field for everyone involved."],
["Is it fair for airlines to charge extra for carry-on luggage?", "global", "easy", "I think it's fair as long as the pricing is clear upfront. Airlines need to manage limited cabin space efficiently. For example, budget airlines often offer lower base fares in exchange for these extra fees. That said, hidden or unclear fees can feel unfair to passengers. Overall, I think transparency is what really matters here. Progress on this front tends to be gradual, shaped more by small adjustments than dramatic reform. Governments and communities will need to strike a balance between competing priorities."],
["Should Vietnam do more to support women returning to work after having children?", "vn", "inter", "Yes, I think stronger support is definitely needed. Many women face real challenges balancing childcare and career after maternity leave. For example, affordable childcare options remain limited in many cities. That said, this requires both government policy and support from employers. Overall, I think this support benefits families and the economy alike. This really highlights how personal circumstances can shape what feels like common sense to different people. Small policy changes can pave the way for much bigger shifts down the line."],
["Is it a good idea for offices to remove assigned desks entirely?", "global", "inter", "I think it depends on the type of work being done. Flexible seating can encourage collaboration and save office space. For example, some companies have successfully adopted this for teams that don't need fixed setups. That said, some employees value having a consistent, personal workspace. Overall, I think offering a choice works better than removing desks entirely. A lot depends on whether the people affected are genuinely consulted before changes take effect. It's the kind of issue that tends to gain momentum once people start talking about it."],
["Should Vietnam raise the retirement age?", "vn", "easy", "Yes, gradually. Life expectancy is rising, and a slightly higher retirement age would ease pressure on the pension system. Countries like Japan have already raised theirs successfully, so Vietnam could follow a similar gradual timeline. That said, physically demanding jobs might need exceptions, since not every worker can realistically continue at the same pace. Overall, a flexible, industry-specific approach seems fairest. Public attitudes toward this seem to be gradually shifting as more real-world examples emerge. Public opinion could shift significantly once more evidence comes to light."],
["Should Vietnam introduce a plastic bag tax nationwide?", "vn", "easy", "Yes, it's worked well in other countries. A small tax encourages people to switch to reusable bags fairly quickly. Within a year, most shoppers usually adjust and bring their own bags out of habit. On the other hand, it could be an extra cost for lower-income households at first. Overall, I think the environmental benefit justifies the small inconvenience. There's rarely a perfect solution here, just a series of reasonable trade-offs to weigh. Either way, this issue is likely to spark debate for a long time to come."],
["Should cash be phased out completely in favor of e-wallets?", "both", "inter", "Not completely — older generations and rural areas still rely heavily on cash, so a full switch would be premature. A slower, region-by-region transition would give everyone time to adapt at their own pace. On the other hand, e-wallets offer convenience and better spending tracking for most users. Reliable transactions also depend on stable internet access nationwide. Overall, I think a gradual, inclusive transition makes more sense than a sudden switch. The strongest arguments here tend to come from people who've actually experienced both sides directly. Small policy changes can pave the way for much bigger shifts down the line."],
["Is overtourism ruining places like Sa Pa and Hoi An?", "vn", "easy", "To some extent, yes. Rapid tourism growth has strained infrastructure and changed the character of these once-quiet towns. Local authorities could introduce visitor caps similar to what some European destinations have done. That said, tourism also brings essential income to these local communities. Overall, I think better management is needed more than reduced tourism itself. This is ultimately less about right and wrong, and more about weighing competing priorities fairly. It's the kind of issue that tends to gain momentum once people start talking about it."],
["Should zoos be banned in favor of wildlife sanctuaries?", "global", "easy", "I think sanctuaries are generally better for animal welfare, though zoos still play a role in education and conservation funding. Sanctuaries usually offer more natural space, though good zoos can still fund important conservation research. On the other hand, zoos can make wildlife conservation more visible and relatable to the public. Overall, I think sanctuaries should be prioritized where possible. What ultimately determines the outcome is usually implementation, not the underlying idea itself. This kind of shift rarely happens overnight, but the direction seems clear."],
["Is Vietnam's street food culture at risk from modernization?", "vn", "easy", "A little, as rising rents push some vendors out, but street food remains deeply embedded in daily life here. Local governments could help by offering affordable designated food stalls to protect these small vendors. That said, some vendors have successfully adapted by modernizing their stalls while keeping traditional recipes. Overall, I think support from local authorities could help preserve this culture. Public attitudes toward this seem to be gradually shifting as more real-world examples emerge. Getting buy-in from the community will matter just as much as the policy itself."],
["Is co-living becoming more common among young Vietnamese professionals?", "vn", "easy", "Yes, especially in big cities, since it's a practical way to split high rent costs with other young workers. It also creates a built-in social network for people new to a city. That said, it can be challenging when people have very different lifestyles or habits. Overall, I think it works well when housemates set clear expectations early. There's rarely a perfect solution here, just a series of reasonable trade-offs to weigh. It's the kind of issue that tends to gain momentum once people start talking about it."],
["Should countries open their borders to more immigration?", "global", "inter", "It depends on the country's needs, but generally, controlled immigration can fill labor gaps and boost the economy. Countries with aging populations, in particular, often benefit from a steady flow of working-age immigrants. On the other hand, rapid immigration without proper planning could strain public services. Overall, I think a well-managed, gradual approach benefits both immigrants and host countries. This debate often reveals a deeper tension between short-term convenience and long-term wellbeing. Reaching a consensus here will likely take time, given how many interests are involved."],
["Should reality TV shows be considered harmful entertainment?", "global", "easy", "Some are, especially ones that encourage conflict for entertainment, but not all reality shows have a negative effect. Shows focused on skills or talent tend to have a much more positive influence than pure drama-driven ones. On the other hand, some shows do highlight real talent and hard work. Controversial editing choices can also distort how audiences perceive contestants. Overall, I think it depends heavily on the specific show and its focus. How people feel about this often reflects broader anxieties about change happening too quickly. Taking this into account, a gradual approach still seems the most realistic option."],
["Is Vietnam's aging population going to strain its healthcare system?", "vn", "inter", "Likely yes, unless investment in healthcare and elderly care services increases significantly over the next decade. Expanding community health clinics could help ease pressure on hospitals as the population ages. That said, technology like telemedicine could help ease some of this pressure. Overall, I think early investment now would prevent bigger problems later. The strongest arguments here tend to come from people who've actually experienced both sides directly. This kind of change rarely comes without cost, but the trade-off feels worthwhile."],
["Is the gig economy (Grab, Baemin) good for workers in the long run?", "both", "inter", "It offers flexibility, but without benefits like insurance, it can be risky for workers relying on it long-term. Offering optional benefits packages could help close this gap without removing the flexibility workers value. That said, the flexibility it offers is genuinely valuable for people balancing multiple responsibilities. Overall, I think it works best as a supplement, not a sole source of income. A lot depends on whether the people affected are genuinely consulted before changes take effect. Building genuine trust here will likely take longer than passing a new rule."],
["Is single-child family pressure changing family values in Vietnam?", "vn", "easy", "Somewhat, since only children often receive more attention and resources, which can shift family dynamics and expectations. It can also increase pressure on that one child to meet high expectations from the whole family. That said, only children often develop strong independence and close parental bonds. Overall, I think the impact really depends on how the family manages expectations. Whatever direction this takes, transparency throughout the process will likely matter as much as the decision itself. Getting buy-in from the community will matter just as much as the policy itself."],
["Is Vietnam losing its heritage architecture to modern development?", "vn", "easy", "In many cities, yes — older buildings are frequently replaced instead of restored, especially in prime commercial areas. Stronger preservation incentives for property owners could help balance heritage protection with development needs. That said, modern development does bring necessary housing and infrastructure improvements. Overall, I think cities need to find creative ways to preserve heritage while still growing. This reflects a broader pattern where convenience and responsibility often pull in opposite directions. This debate carries real weight because it touches so many people's daily lives."],
["Should countries ban single-use plastics entirely?", "global", "easy", "A full ban may be difficult immediately, but a phased approach starting with the most wasteful items makes sense. Starting with plastic straws and bags, like several countries have already done, makes the transition easier. On the other hand, alternatives aren't always as affordable or accessible yet. Excessive packaging and pollution remain the biggest underlying concerns. Overall, I think a gradual ban paired with better alternatives is the most realistic path. Public attitudes toward this seem to be gradually shifting as more real-world examples emerge. Raising awareness alone won't solve it, but it's a reasonable place to start."],
["Is Vietnam's night economy (bar streets, night markets) good for cities?", "vn", "easy", "Yes, it boosts tourism and local business, as long as noise and safety are properly managed. Better lighting and more visible security could help address safety concerns without hurting the atmosphere. That said, some residents living nearby understandably worry about late-night disturbances. Overall, I think good planning can let both nightlife and residents coexist. How this plays out will likely depend heavily on local context rather than a single universal answer. If handled poorly, this could pose a threat to public trust over time."],
["Should AI-generated art be copyrighted?", "global", "inter", "It's a gray area — I think the person who created the prompt or edited the output deserves some rights, but not full ownership. Clearer guidelines from copyright offices would help artists and AI companies avoid future legal disputes. On the other hand, some argue AI tools are just another creative tool, like a camera or brush. Overall, I think clearer legal definitions are needed as the technology evolves. Whether this succeeds probably comes down to how thoughtfully it's rolled out over time. Reaching a consensus here will likely take time, given how many interests are involved."],
["Is Vietnam's obsession with celebrity gossip (sao Việt) unhealthy?", "vn", "easy", "To some degree, yes, especially when it distracts from more important news or leads to online harassment of celebrities. It can also normalize invasive reporting that most public figures never actually consented to. That said, some see it as harmless entertainment and a way to unwind. Overall, I think moderation is key, as with most media consumption. This is one of those topics where perspectives can shift considerably depending on someone's personal experience. This debate could set a precedent for how similar issues get handled elsewhere."],
["Should countries introduce a shorter school day for students?", "global", "easy", "It could help reduce stress, as long as the curriculum is adjusted so students aren't just given more homework instead. Countries that have tried this often pair it with more efficient, focused lesson planning. On the other hand, less time in school could reduce opportunities for extracurricular activities. Overall, I think quality of learning time matters more than quantity. As with most policy questions, the details of execution tend to matter as much as the principle behind it. Taking this into account, a gradual approach still seems the most realistic option."],
["Is Grab/food delivery culture reducing home cooking in Vietnam?", "vn", "easy", "Somewhat, especially among busy young professionals who now order food more often than they cook at home. Cooking classes or meal-kit services could help balance convenience with healthier eating habits. That said, delivery apps have also introduced people to healthier meal options they might not have tried otherwise. Overall, I think balance between convenience and home cooking is ideal. I suspect attitudes toward this will keep changing as younger generations become more influential. This kind of change rarely comes without cost, but the trade-off feels worthwhile."],
["Is workplace surveillance software an invasion of privacy?", "global", "inter", "To some extent, yes, especially when it tracks personal activity rather than just work-related tasks. Clear company policies about what is and isn't monitored would help build trust. On the other hand, some monitoring can help protect company data and prevent misuse. Overall, I think clear, limited policies are key to balancing both concerns. It's easy to have strong opinions on this in theory, but much harder once real trade-offs are involved. If handled poorly, this could pose a threat to public trust over time."],
["Should Vietnam invest more in high-speed rail between major cities?", "vn", "inter", "Yes, it would reduce domestic flights and make travel between major cities faster and more environmentally friendly. Japan and China have shown how effective high-speed rail can be for reducing regional travel time. That said, the initial cost and construction time would be substantial. Overall, I think the long-term economic and environmental benefits justify the investment. This reflects a broader pattern where convenience and responsibility often pull in opposite directions. Small policy changes can pave the way for much bigger shifts down the line."],
["Should Vietnam's night markets be better regulated for safety?", "vn", "easy", "Yes, especially around fire safety and food hygiene, since these markets can get very crowded. Clear evacuation routes and regular safety inspections would go a long way in crowded markets. On the other hand, overregulation could reduce the spontaneous, vibrant atmosphere that makes them popular. Overall, I think safety improvements can be made without losing that charm. This is one of those topics where perspectives can shift considerably depending on someone's personal experience. Public opinion could shift significantly once more evidence comes to light."],
["Is the subscription-based economy (Netflix, Spotify, etc.) good value for consumers?", "global", "inter", "It can be, but subscribing to too many services at once often ends up costing more than people realize. Bundling subscriptions or sharing accounts with family members can help keep costs more reasonable. That said, individual subscriptions can offer great value if chosen carefully. Overall, I think mindful spending is key to getting real value from subscriptions. As with most policy questions, the details of execution tend to matter as much as the principle behind it. This issue has the potential to shed light on deeper social attitudes."],
["Is the trend of minimalism a healthy response to consumer culture?", "global", "inter", "I think so — it encourages people to buy less and focus more on what they actually need or value. It also tends to reduce financial stress by encouraging more thoughtful spending habits. That said, minimalism isn't realistic or appealing for everyone's lifestyle. Overall, I think even small steps toward it can have a positive impact. It's a reminder that good policy usually requires patience rather than sweeping, immediate change. Getting buy-in from the community will matter just as much as the policy itself."],
["Should Vietnam introduce congestion charges in Hanoi and Ho Chi Minh City?", "vn", "inter", "I think a congestion charge could work, but only if public transport improves first. Charging drivers to enter the city center would reduce gridlock and cut emissions in the busiest districts. For example, London's scheme noticeably eased traffic, although it disproportionately affected low-income commuters. That said, in Vietnam most people ride motorbikes, so the policy would need careful design. Overall, I'd support a pilot scheme, as long as the revenue funds metro lines and buses. In the long run, that kind of investment is the only way to make the system sustainable."],
["Should companies be required to publish their gender pay gap?", "global", "inter", "I believe transparency is the best way to hold employers accountable. When salary data is public, it becomes much harder to justify unequal pay for the same role. For instance, in the UK, mandatory reporting pushed many firms to review their promotion practices. However, critics argue that raw figures can be misleading because they ignore differences in career breaks and industries. Overall, I'd back mandatory reporting, provided that companies can explain the context behind the numbers. It's a modest step that can gradually narrow the gap."],
["Is the rise of ultra-processed convenience food a public health risk?", "both", "easy", "Yes, I think it is, because cheap packaged snacks are now everywhere and easy to overeat. Many of them are high in sugar and salt, which can contribute to obesity and diabetes over time. For example, instant noodles and sugary drinks have become daily staples for many students. That said, convenience food isn't always the enemy, since busy families often have limited options. Overall, clearer labeling and healthier school canteens would make a real difference. Public health problems like this tend to build up quietly before they become obvious."],
["Should Vietnam make financial literacy a compulsory school subject?", "vn", "easy", "Definitely, since most young people learn about money only after they make costly mistakes. Basic lessons on budgeting, saving and interest rates would help students avoid falling into debt. For example, many first-time earners get lured by credit cards or online loans without reading the terms. That said, the curriculum is already packed, so the subject should be practical rather than theoretical. Overall, I think it deserves a place in the timetable, even if it replaces something less useful. Good money habits formed early can last a lifetime."],
["Is it acceptable to use AI tools to write university assignments?", "global", "inter", "I'd say it depends on how the tool is used, because there is a big difference between brainstorming and outsourcing your thinking. Using AI to organize ideas or check grammar is a legitimate form of support. However, submitting generated text as your own work undermines academic integrity and deprives students of critical thinking practice. Universities will have to rethink assessment, perhaps with more oral exams and in-class writing. Overall, I think the focus should be on transparent use rather than a blanket ban. Education has to adapt to the tools students will use at work anyway."],
["Should short-term rentals like Airbnb be restricted in popular tourist areas?", "both", "inter", "I think some restrictions are justified, since unchecked short-term rentals can push up rents and drive out long-term residents. In places like Hoi An and Da Nang, entire buildings have been converted into tourist accommodation. That said, homeowners benefit from the extra income, and visitors enjoy more affordable options. A reasonable compromise would be to cap the number of nights a property can be rented each year. Overall, regulation should strike a balance between tourism and the needs of local communities. Otherwise, neighborhoods risk losing the very character that attracts visitors."],
["Is the 'side hustle' trend healthy for young professionals?", "global", "easy", "It can be, but it often takes a toll on rest and relationships. A side project may build new skills and bring in extra income, which is valuable when living costs keep rising. However, many young people feel pressured to monetize every hobby, which leads to burnout. For example, a friend of mine started selling handmade candles and ended up working seven days a week. Overall, I think a side hustle is healthy only if it's chosen freely and not out of financial anxiety. Everyone needs time that isn't tied to productivity."],
["Should elderly care be the responsibility of the family or the state?", "vn", "inter", "In my view, it should be a shared responsibility, particularly as Vietnam's population ages rapidly. Traditionally, children look after their parents, which strengthens family bonds. But smaller families and urban migration make this increasingly difficult for working adults. The state therefore needs to invest in nursing facilities, home care services and affordable healthcare. Overall, relying solely on families is no longer realistic, although emotional support will always matter most. The challenge is to modernize care without weakening the values behind it."],
["Is Vietnam doing enough to protect its historic old quarters from overdevelopment?", "vn", "inter", "Not quite, in my opinion, because the pressure from developers and rising land prices is intense. Old quarters in Hanoi and Hue contain buildings that are irreplaceable, yet many are neglected or demolished for commercial projects. For example, shophouses are often renovated with modern materials that erase their original character. That said, there are encouraging restoration efforts supported by local communities. Overall, stronger heritage laws and incentives for owners to preserve their properties would help a lot. Once a historic district is lost, no amount of money can bring it back."],
["Is studying abroad still worth the cost?", "global", "inter", "I think it can be, but only if you have a clear goal and a realistic budget. Studying abroad broadens your perspective, improves your language skills and builds an international network. However, tuition and living expenses have soared, and some graduates struggle to find jobs that justify the investment. For example, a degree from a mid-ranked overseas university may not carry more weight than a strong local one. Overall, scholarships and exchange programs offer a far better return than paying full price. The experience matters, but the financial burden should never be underestimated."],
["Should Vietnam charge visitors an entry fee for its most popular natural sites?", "vn", "easy", "Yes, I think a reasonable fee is a good idea, as long as the money is actually used for conservation. Popular spots like caves and national parks suffer from litter and erosion caused by large crowds. A small charge can also discourage overcrowding and raise awareness about protecting nature. That said, the price should be fair so that local families can still afford to visit. Overall, entry fees work best when the funds are transparent and reinvested in the site. Natural beauty is a shared asset that deserves proper care."],
["Is 'buy now, pay later' encouraging irresponsible spending?", "global", "inter", "I'm inclined to say yes, since splitting a payment makes expensive items feel deceptively cheap. Young shoppers can easily accumulate several small debts that add up to a heavy burden. For example, someone might buy a phone, a jacket and a laptop on installments without realizing how much they owe each month. That said, used wisely, these services help people manage cash flow without paying credit card interest. Overall, stricter rules on transparency and affordability checks would protect vulnerable consumers. Easy credit is only a blessing for those who read the fine print."],
["Should employers offer paid time off for volunteering?", "global", "easy", "I think it's a smart policy that benefits everyone involved. Employees feel more motivated and connected to their community, and the company builds a better reputation. For example, some firms give each worker two days a year to help at shelters or clean up beaches. That said, small businesses may find it hard to cover the extra absence. Overall, I'd encourage companies to try it, even on a modest scale. Giving back can also strengthen teamwork in ways that a regular workshop cannot."],
["Should facial recognition be used in public spaces?", "global", "inter", "I'm wary of it, because the technology can easily slide into mass surveillance. Supporters say it helps police track down criminals and prevent terrorism. However, errors and bias in the algorithms could lead to innocent people being wrongly identified. For example, several cities have already scaled back its use after public backlash. Overall, I'd accept it only under strict legal oversight and clear limits on data storage. Convenience should never come at the expense of civil liberties."],
["Is it wise to store all personal documents on the cloud?", "both", "easy", "It's convenient, but I wouldn't put everything in one place. Cloud storage lets you access files from any device and protects you if your laptop breaks. On the other hand, accounts can be hacked, and a weak password is a serious vulnerability. For example, a colleague of mine lost years of photos after her account was compromised. Overall, the smartest approach is to keep a backup offline as well. It pays to have a safety net for the things you can't replace."],
["Should children learn coding from primary school?", "both", "easy", "I think it's a great idea, as long as it's taught through games and projects. Coding builds logical thinking and problem-solving skills that are useful in any career. Children also get comfortable with technology instead of just consuming it. That said, forcing complex syntax on young kids could backfire and put them off. Overall, an early introduction is worthwhile if it stays playful and flexible. The goal is curiosity, not creating tiny programmers."],
["Are voice assistants a threat to our privacy?", "global", "inter", "To some extent, yes, since these devices are always listening for a wake word. Companies insist that recordings are anonymized, but there have been cases where staff reviewed private conversations. The convenience of controlling your home by voice is tempting, yet it comes with hidden trade-offs. For example, a smart speaker in a bedroom can capture far more than people realize. Overall, users should read the privacy settings carefully and switch off features they don't need. Awareness is the first line of defense."],
["Should self-driving cars be allowed on Vietnamese roads?", "vn", "inter", "Not in the near future, in my opinion, because our traffic is far too unpredictable. Autonomous vehicles are trained on orderly roads, whereas ours are full of motorbikes weaving between lanes. A single software error could have fatal consequences. That said, the technology could be tested in controlled environments such as industrial zones or airports. Overall, I'd welcome gradual trials rather than a full rollout. Safety must come before the novelty of the technology."],
["Are e-books replacing paper books for good?", "both", "easy", "I don't think so, although e-books have clearly taken a large share of the market. They're cheap, portable and easy to carry around on a long trip. However, many readers still prefer the feel of paper and find it easier to concentrate without notifications. For example, my sister owns an e-reader but still buys physical copies of her favorite novels. Overall, I believe the two formats will coexist for a long time. Each one serves a different mood and purpose."],
["Should tech companies be held responsible for misinformation on their platforms?", "global", "inter", "I believe they should share responsibility, since their algorithms often amplify sensational content. Platforms profit from engagement, and false stories tend to spread faster than facts. At the same time, strict liability could lead to over-censorship and silence legitimate opinions. For instance, during health crises, misleading posts have caused real harm. Overall, a sensible solution is mandatory fact-checking tools combined with transparent moderation rules. Accountability is essential when a handful of firms shape public debate."],
["Are online platforms like Coursera as valuable as a university degree?", "both", "inter", "They're valuable, but they serve a different purpose from a traditional degree. Online courses are flexible and affordable, and they let you acquire specific skills quickly. However, employers still tend to trust university qualifications, particularly in fields such as medicine or law. Many learners also lack the discipline to finish courses without deadlines. Overall, I see online learning as a powerful supplement rather than a replacement. The best career strategy combines both."],
["Should deepfake content be illegal?", "global", "inter", "Malicious deepfakes should definitely be illegal, because they can ruin reputations in a matter of hours. Fake videos have been used for fraud, harassment and political manipulation. On the other hand, the same technology has harmless uses in film, satire and education. A blanket ban would therefore go too far. Overall, laws should target deception and non-consensual content, and platforms should be required to label synthetic media. Trust in what we see is too precious to lose."],
["Is the rapid pace of smartphone upgrades wasteful?", "both", "easy", "Yes, I think it is, because most people don't need a new phone every year. Manufacturers release small improvements and market them as breakthroughs. Meanwhile, discarded devices pile up as electronic waste that is hard to recycle. For example, my old phone still works perfectly, yet advertisements make it feel obsolete. Overall, longer-lasting products and easier repairs would benefit both consumers and the planet. We should resist the pressure to chase every new model."],
["Should robots be used to care for the elderly?", "global", "inter", "I think robots can assist, but they shouldn't replace human contact. They are useful for reminding patients to take medication, lifting them safely or monitoring falls. However, loneliness is a major problem among older people, and a machine can't offer genuine empathy. Staff shortages are pushing aging societies like Japan to adopt this technology anyway. Overall, robots should relieve caregivers of routine tasks so they can spend more time on emotional support. Compassion remains a human job."],
["Is a digital detox retreat worth the money?", "global", "easy", "Honestly, I think you can get most of the benefits for free. Paying for a retreat may help people who struggle with self-discipline, since there are no phones to tempt them. But the same effect can be achieved by switching off notifications and spending a weekend offline. For example, a hike with friends gives you the same break without the price tag. Overall, a detox is valuable, but it doesn't need to be a luxury product. The real challenge is keeping the habits after you return."],
["Should schools use AI tutors to personalize learning?", "global", "inter", "I think they have great potential if used carefully. An AI tutor can adapt to each student's pace and explain difficult concepts repeatedly without losing patience. This could be a lifeline for students who fall behind in crowded classrooms. Nevertheless, there are concerns about data privacy and over-reliance on technology. Overall, AI should support teachers, not replace them, because motivation and mentoring still come from people. Technology works best when it frees educators to focus on what matters."],
["Should Vietnam ban plastic straws and cutlery in food delivery?", "vn", "easy", "I think it's a sensible step, given how much plastic waste delivery orders generate. Most of these items are used for a few minutes and then thrown away. Paper or bamboo alternatives are now widely available, although they cost slightly more. For example, some cafés have already switched and customers hardly noticed the difference. Overall, a ban combined with an opt-in system for cutlery would reduce waste quickly. Small changes in everyday habits add up on a national scale."],
["Is recycling enough to solve the waste problem?", "global", "inter", "No, recycling alone is not enough, because it deals with waste after it has already been created. Only a fraction of plastic is actually recycled, and the process itself consumes energy. A more effective approach is to cut consumption and design products that last. For example, refill stations and reusable packaging prevent waste in the first place. Overall, recycling is a helpful last step, but reduction and reuse should come first. We need to rethink our throwaway habits."],
["Should individuals or corporations bear more responsibility for climate change?", "global", "inter", "I'd argue that corporations carry the heavier burden, since a small number of companies produce a large share of emissions. Individuals can recycle and save energy, but their impact is limited compared with industrial pollution. Still, consumer choices send a message and can pressure businesses to change. For instance, rising demand for sustainable products has pushed many brands to rethink their supply chains. Overall, responsibility is shared, but regulation must target the biggest polluters. Personal action works best when systems support it."],
["Is nuclear power a safe option for Vietnam's future energy?", "vn", "inter", "I think it could be, provided that strict safety standards and skilled engineers are in place. Nuclear plants produce large amounts of low-carbon electricity, which would help reduce our reliance on coal. However, the risks of accidents and the problem of storing radioactive waste can't be ignored. Vietnam is also vulnerable to earthquakes and typhoons in some regions. Overall, I'd prioritize renewables first and revisit nuclear once the technical expertise is proven. Energy security needs careful long-term planning."],
["Should drivers pay higher fees in heavily polluted cities?", "both", "easy", "I think so, since the people who cause most of the pollution should pay for it. Extra fees could discourage unnecessary trips and encourage commuters to use public transport. The revenue could be spent on cleaner buses and more green spaces. That said, such a policy shouldn't hit low-income workers who have no alternative. Overall, fees work well when affordable options exist alongside them. Cleaner air benefits everybody, drivers included."],
["Is urban farming a realistic solution for city food supply?", "global", "inter", "It's a useful addition, but it can't feed an entire city. Rooftop gardens and vertical farms reduce transport emissions and give residents access to fresh produce. They also bring communities together and make neighborhoods greener. However, limited space and high set-up costs restrict how much food can be grown. Overall, urban farming is best seen as a complement to traditional agriculture. Even small projects can change the way people think about food."],
["Should farmers in the Mekong Delta get more help against saltwater intrusion?", "vn", "inter", "Definitely, because their livelihoods are being threatened by a problem they didn't cause. Rising seas and upstream dams have pushed salt water further inland and damaged rice harvests. Farmers need practical support such as salt-tolerant crop varieties, reservoirs and training. For example, some families have switched to shrimp farming with government guidance and have recovered their income. Overall, adaptation funding should be a national priority. Protecting the Delta means protecting the country's food security."],
["Is eating less meat a fair demand for tackling climate change?", "global", "easy", "I think it's a reasonable request, but it shouldn't be forced on anyone. Livestock farming produces a large share of greenhouse gases, so cutting back makes a difference. For many people, even one meat-free day a week is easy to manage. That said, meat is deeply rooted in many cultures and is an affordable source of protein for some families. Overall, encouraging moderation is more realistic than preaching extreme change. Small shifts across millions of households can have a big impact."],
["Should cities plant more trees even if it means fewer parking spaces?", "both", "easy", "Yes, I think trees are worth more than parking spots. They provide shade, reduce noise and lower temperatures during hot summers. Green streets also make neighborhoods more pleasant for walking and cycling. That said, shop owners often worry about losing customers who arrive by car. Overall, the best compromise is to add trees while improving public transport and parking buildings. A leafy city is a healthier and more livable one."],
["Is secondhand shopping the future of fashion?", "global", "easy", "I'd like to think so, since it cuts waste and saves money at the same time. Thrift stores and resale apps have become fashionable, especially among young people. Buying secondhand extends the life of clothes that would otherwise end up in landfill. For example, I found a great jacket at a vintage market for a fraction of the original price. Overall, it won't replace new clothing entirely, but it will keep growing. Sustainable style is no longer a niche idea."],
["Should Vietnam charge for single-use coffee cups?", "vn", "easy", "I think it's a smart nudge, because people respond to small financial incentives. A modest fee would encourage customers to bring their own reusable cups. Several chains abroad have already seen a noticeable drop in disposable cup use. That said, the policy should be clearly explained so that customers don't feel they're being overcharged. Overall, a small charge combined with a discount for reusable cups is a fair approach. Habits change faster when the better choice is also the cheaper one."],
["Is it right to prioritize economic growth over environmental protection?", "global", "inter", "I don't think it's an either-or choice, and prioritizing growth at any cost is shortsighted. Environmental damage eventually harms the economy through health costs, lost farmland and extreme weather. Developing countries understandably want to raise living standards quickly. However, cleaner technologies are becoming cheaper and can create new jobs. Overall, the most sustainable path combines growth with strong environmental rules. A healthy planet is the foundation of any lasting prosperity."],
["Should university students be allowed to choose all of their own courses?", "global", "inter", "I think students should have a lot of freedom, but not complete freedom. Choosing courses that match their interests keeps them motivated and helps them discover their strengths. However, without guidance, some may avoid challenging subjects and graduate with gaps in their knowledge. A flexible system with a few core requirements strikes a good balance. For example, many universities abroad let students design a major within certain limits. Overall, autonomy should come with academic advice. Learning works best when it is both free and structured."],
["Is homework in primary school really necessary?", "both", "easy", "I think a little is helpful, but too much does more harm than good. Short tasks help children review what they learned and build a routine. However, young kids also need time to play, rest and explore their own interests. For example, a child who spends three hours on worksheets every night often becomes tired and stressed. Overall, I'd limit homework to about twenty minutes and make it creative. Childhood shouldn't feel like a second job. At the end of the day, the key is to weigh up both sides and play a vital role in finding common ground. Getting this right could narrow the gap between ideals and everyday reality, and raising public awareness is a good start."],
["Should schools teach emotional intelligence?", "global", "inter", "Absolutely, because managing emotions is just as important as solving equations. Students who can express feelings and handle conflict tend to perform better and bully less. Yet most curricula focus almost entirely on academic knowledge. Short weekly lessons on empathy, stress management and communication could change that. Overall, emotional intelligence should be treated as a core skill, not an optional extra. It prepares young people for relationships and careers alike."],
["Is a gap year a waste of time?", "global", "easy", "Not at all, as long as you use it wisely. A year off can help students figure out what they actually want to study and avoid choosing a degree by default. Working, volunteering or traveling also builds maturity and real-life skills. That said, some students struggle to return to study after a long break. Overall, a gap year is worthwhile when it has a clear plan and purpose. Time spent exploring is rarely wasted. On balance, it is a topic that can spark debate, so we should hold decision-makers accountable. Those who ignore the root cause will only widen the gap in the long run."],
["Should teachers be evaluated by their students?", "both", "inter", "I believe student feedback is valuable, but it shouldn't be the only measure. Students can tell whether a teacher explains clearly and creates a respectful atmosphere. However, ratings can be influenced by grades or personal popularity rather than teaching quality. A fair system would combine student surveys, classroom observations and peer review. Overall, feedback should be used to help teachers improve, not to punish them. Constructive evaluation benefits everyone in the classroom. Ultimately, the long-term implications deserve careful thought, and any policy should address the root cause."],
["Is learning English too early harmful to a child's mother tongue?", "vn", "inter", "Generally no, provided that the mother tongue remains strong at home. Young children are very good at picking up sounds and can handle two languages without confusion. Research suggests that bilingual kids often develop better attention and flexibility. However, if English replaces Vietnamese in daily conversation, their native vocabulary could suffer. Overall, I'd encourage early exposure through songs and games while keeping Vietnamese central. Language should enrich identity, not erode it."],
["Should universities focus more on employability than on academic research?", "both", "inter", "I think they need to balance both, but employability deserves more attention. Many graduates leave university with theoretical knowledge but few practical skills. Internships, projects and industry partnerships would prepare them far better for the job market. On the other hand, research drives innovation and keeps teaching up to date. Overall, a good university links research with real-world application. Education should open doors, not just award certificates."],
["Are standardized tests a fair way to measure ability?", "global", "inter", "They are fair in the sense that everyone sits the same exam, but they only capture a narrow slice of ability. Students who are good at memorizing do well, while creative or practical thinkers may be overlooked. Test anxiety can also distort results. For example, a brilliant student might underperform simply because of nerves on one day. Overall, tests should be one tool among many, alongside projects and continuous assessment. A single score can never tell the whole story."],
["Should school uniforms be abolished?", "both", "easy", "I'd keep them, because they reduce peer pressure and make students feel equal. Nobody has to worry about wearing the latest brand, which saves families money. Uniforms also create a sense of belonging and make schools easier to supervise. That said, they can feel restrictive and limit self-expression. Overall, I support uniforms with a bit of flexibility, such as free-dress days. Simple rules can help students focus on learning."],
["Is boarding school beneficial for children?", "global", "inter", "It can be, but it depends on the child and the quality of the school. Boarding teaches independence, time management and teamwork from an early age. It can also provide a focused environment for study. On the other hand, being away from family may cause loneliness, especially for younger children. Overall, I'd consider it only for older students who are emotionally ready. Strong relationships at home matter as much as discipline at school. At the end of the day, the key is to weigh up both sides and play a vital role in finding common ground. Getting this right could narrow the gap between ideals and everyday reality, and raising public awareness is a good start."],
["Should schools start later in the morning?", "both", "easy", "Yes, I think teenagers would benefit from an extra hour of sleep. Their body clocks naturally shift later, so early starts leave many of them exhausted in class. Studies show that students who sleep more concentrate better and have better moods. The downside is that later finishing times might clash with parents' work schedules. Overall, a later start is worth trying, even if it needs some logistical adjustments. A well-rested student learns far more than a sleepy one."],
["Is group work at school fair to hardworking students?", "global", "easy", "It can feel unfair when a few people do all the work while others coast along. Nevertheless, teamwork is a vital skill that students will need in the workplace. Teachers can make it fairer by assigning clear roles and grading individual contributions. For example, peer evaluations help reveal who actually did what. Overall, group projects are valuable when they are carefully managed. The aim is to teach cooperation, not to reward freeloaders. On balance, it is a topic that can spark debate, so we should hold decision-makers accountable."],
["Should employees be paid to take sabbaticals?", "global", "inter", "I think it's a wise investment for companies that want to retain talent. A few months of rest or study can prevent burnout and bring back employees with fresh ideas. Paid sabbaticals also signal that the company values wellbeing, which strengthens loyalty. However, smaller firms may not be able to cover the cost or the workload. Overall, a partially paid option after several years of service would be a reasonable compromise. Rested workers are more creative and productive."],
["Is job-hopping a smart career strategy?", "both", "inter", "It can be, especially in the early stages of a career. Switching jobs often leads to faster salary growth and exposure to different industries. But if you move every few months, employers may doubt your commitment. A good rule of thumb is to stay long enough to deliver results and learn something substantial. Overall, job-hopping works when each move has a purpose. Career growth should be deliberate, not impulsive."],
["Should companies hire based on skills rather than degrees?", "global", "inter", "I believe skills should carry more weight, because a diploma doesn't guarantee competence. Many talented people learn through bootcamps, self-study or experience. Skills-based hiring widens the talent pool and gives opportunities to those who couldn't afford university. That said, some professions, such as medicine, legitimately require formal qualifications. Overall, employers should test real abilities and treat degrees as one factor among many. Potential matters more than paperwork."],
["Is an open-plan office good for productivity?", "global", "easy", "Not really, in my experience. Open layouts encourage communication, but constant noise and interruptions make deep work difficult. Many employees end up wearing headphones just to concentrate. For example, a friend of mine says she gets more done in two quiet hours at home than in a whole day at the office. Overall, the best workplaces offer a mix of open areas and quiet rooms. Different tasks need different environments."],
["Should there be a limit on the pay gap between CEOs and ordinary employees?", "global", "inter", "I think some form of limit or at least disclosure is reasonable. In many companies, executives earn hundreds of times more than average staff, which damages morale. Critics argue that top leaders carry enormous responsibility and deserve high pay. Still, extreme gaps can discourage workers and fuel public resentment. Overall, transparent pay ratios would encourage boards to be more thoughtful. Fairness helps a company in the long run."],
["Is it ethical to work for a company whose values you disagree with?", "global", "inter", "It's a personal dilemma, and I don't think there's a simple answer. Many people need the income and can't afford to be picky. However, working against your principles day after day can erode your motivation and sense of integrity. If the disagreement is minor, it may be tolerable, but if it involves harm, I think leaving is the right choice. Overall, everyone should know where their own limits are. A job is more than a paycheck."],
["Should fathers get equal paternity leave?", "global", "inter", "Yes, I think equal leave is a step toward fairer parenting. When both parents can take time off, mothers aren't the only ones carrying the load and children bond with both. It also reduces discrimination against women in hiring, since employers can no longer assume only they will take leave. The main obstacle is cost, particularly for small businesses. Overall, governments should share the expense through insurance schemes. Caring for children is a joint responsibility. Those who ignore the root cause will only widen the gap in the long run. Ultimately, the long-term implications deserve careful thought, and any policy should address the root cause."],
["Is mentoring more valuable than formal training?", "both", "easy", "I think they complement each other, but mentoring often leaves a deeper impression. A good mentor shares practical lessons, gives honest feedback and opens doors that courses cannot. Formal training, on the other hand, provides a solid foundation of theory. For example, I learned more from one senior colleague than from a week-long workshop. Overall, the ideal combination is training for knowledge and mentoring for guidance. Personal support makes learning stick."],
["Should companies offer unlimited vacation days?", "global", "easy", "It sounds generous, but in practice it can backfire. Without a clear number, employees often feel guilty about taking time off and end up using less. Managers may also treat leave inconsistently. A fixed allowance, even a generous one, gives people the confidence to rest. Overall, unlimited leave works only in a culture of trust and clear expectations. Rest should be a right, not a favor."],
["Is networking more important than talent?", "both", "inter", "Talent opens the door, but networking often decides who gets to walk through it. Many opportunities, from jobs to partnerships, never get advertised and are passed on by word of mouth. Even a brilliant person can remain invisible without connections. Nevertheless, relationships won't last if you can't deliver results. Overall, I'd say they reinforce each other. Build your skills, and make sure the right people know about them. At the end of the day, the key is to weigh up both sides and play a vital role in finding common ground."],
["Should part-time workers receive the same benefits as full-time employees?", "global", "inter", "I think they should at least receive proportionate benefits, such as paid leave and insurance. Many part-timers work in demanding jobs and contribute just as much per hour. Denying them protection creates a two-tier workforce and encourages employers to avoid full contracts. Of course, the cost has to be manageable for businesses. Overall, a pro-rata system seems the fairest solution. Everyone deserves a basic safety net."],
["Is entrepreneurship a better path than a stable job for graduates?", "both", "inter", "It depends on your risk tolerance and financial situation. Starting a business offers independence and the possibility of high rewards, but most startups struggle in the first few years. A stable job provides income, mentoring and the chance to learn how companies operate. Many successful founders gained experience as employees before launching their ventures. Overall, I'd suggest working for a few years first, unless you have a very strong idea. Timing can make all the difference."],
