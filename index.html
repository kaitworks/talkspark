["What is your idea of a perfect weekend?", "easy", "My idea of a perfect weekend is a mix of rest and activity.", "I like having free time but also getting outside.", "For example, I might relax in the morning and hike in the afternoon. It's one of those small preferences that says more about me than I'd expect.", "So balance is what makes a weekend feel perfect to me."],
["Do you think it's important to learn to swim?", "easy", "Yes, I think it's an important safety skill.", "It could genuinely save your life in an emergency.", "For example, many schools now include swimming lessons for this reason. Friends who know me well aren't surprised by that at all.", "So I believe everyone should learn at some point."],
["What is your favorite childhood toy or game?", "easy", "My favorite childhood toy was a set of building blocks.", "It let me build anything I could imagine.", "For example, I used to spend hours creating little towns. It's become a bit of a personal tradition at this point.", "So it holds a special place in my memory."],
["Do you enjoy volunteering?", "inter", "Yes, I find volunteering quite rewarding.", "It gives me a sense of purpose beyond my daily routine.", "For example, I helped at a community event last year. I doubt I'll change that habit anytime soon, honestly.", "So I try to volunteer whenever I have the time."],
["What is your favorite way to stay in touch with old friends?", "easy", "My favorite way is through a group chat.", "It keeps everyone updated without needing to plan a call.", "For example, we share updates and photos regularly. It's a small detail, but it makes an ordinary day feel a bit better.", "So it helps us stay close despite busy schedules."],
["Do you prefer indoor or outdoor markets?", "easy", "I prefer outdoor markets.", "They usually have a livelier, more colorful atmosphere.", "For example, I enjoy browsing the stalls at weekend markets. That's stayed consistent for me even as other things in my life have changed.", "So outdoor markets feel more enjoyable to me."],
["What is a skill you think everyone should learn?", "inter", "I think everyone should learn basic financial planning.", "It helps people manage money and avoid unnecessary stress.", "For example, understanding budgeting could prevent a lot of debt. It's the kind of thing that seems minor until you try going without it.", "So I believe it should be taught more widely."],
["Do you enjoy watching documentaries?", "easy", "Yes, I really enjoy watching documentaries.", "They're an easy way to learn something new while relaxing.", "For example, I recently watched one about ocean life. I've recommended it to a few people, and most of them agree.", "So documentaries have become a regular part of my viewing."],
["What is your opinion on working overtime?", "inter", "I think occasional overtime is fine, but not as a habit.", "Regular overtime can lead to burnout over time.", "For example, I've seen coworkers struggle with exhaustion from it. It's genuinely one of the more reliable parts of my routine.", "So I believe balance should always come first."],
["Do you like surprises?", "easy", "Yes, I generally like surprises.", "They add a bit of excitement to an ordinary day.", "For example, a surprise visit from a friend once made my whole week. Over time, it's become less of a choice and more of a habit.", "So I always appreciate a good surprise."],
["What is your favorite way to celebrate an achievement?", "easy", "My favorite way is going out for a nice meal.", "It feels like a proper way to mark the moment.", "For example, I did this after finishing a big project recently. That's probably the closest thing I have to a daily ritual.", "So it's become my go-to way to celebrate."],
["Do you think it's easy to make new friends as an adult?", "inter", "Honestly, I think it's harder than people expect.", "Adult life leaves less time and fewer natural opportunities to meet people.", "For example, most of my recent friendships started through work. It's a preference I've had for years, and it hasn't really faded.", "So I think it takes more effort than in school."],
["What is your favorite childhood snack?", "easy", "My favorite childhood snack was homemade sticky rice.", "It reminds me of afternoons spent at my grandmother's house.", "For example, she used to make it every weekend. I suspect most people have something similar, even if they don't talk about it.", "So it's tied to a lot of good memories."],
["Do you prefer working with your hands or on a computer?", "easy", "I prefer working on a computer.", "Most of my tasks involve writing or organizing digital information.", "For example, I spend most of my day typing or researching. It's a small thing, but it genuinely adds up over time.", "So computer-based work suits me better."],
["What is a place you have never been but want to visit?", "easy", "A place I'd love to visit is Iceland.", "The landscapes look incredible, especially the glaciers and waterfalls.", "For example, I've seen so many amazing photos of it online. That consistency is honestly what makes it feel meaningful rather than random.", "So it's high on my travel wish list."],
["Do you enjoy attending workshops or training sessions?", "inter", "Yes, I generally enjoy them.", "They're a good way to pick up new skills quickly.", "For example, I attended a communication workshop that really helped me. It's become something I look forward to without really thinking about it anymore.", "So I try to join them when I get the chance."],
["What is your favorite way to spend time with your parents?", "easy", "My favorite way is cooking together.", "It's relaxed, and we get to chat while we work.", "For example, we often make dumplings together on weekends. Looking back, it's a habit I probably wouldn't give up easily.", "So it's become a nice bonding activity."],
["Do you think social media influences how people see themselves?", "inter", "Yes, I think it has a significant influence.", "Constant comparison to curated images can affect self-esteem.", "For example, many young people feel pressure to look a certain way online. It's surprising how much of a difference something that simple can make.", "So I think it's an issue worth taking seriously."],
["What is your favorite type of book to read?", "easy", "My favorite type of book is mystery fiction.", "I enjoy trying to solve the puzzle before the ending.", "For example, I just finished a detective novel last week. That routine has quietly shaped a lot of how I structure my week.", "So mystery books are what I reach for most often."],
["Do you enjoy public speaking?", "inter", "Not particularly, though I've gotten more comfortable with it.", "Speaking in front of others used to make me quite nervous.", "For example, my first presentation at work was stressful. I've noticed it genuinely affects my mood on the days I skip it.", "So it's something I've had to work on over time."],
["What is your favorite season for outdoor activities?", "easy", "My favorite season for outdoor activities is spring.", "The weather is mild, which makes being outside more enjoyable.", "For example, I go cycling much more often in spring. It's one of those small preferences that says more about me than I'd expect.", "So it's the season I'm most active in."],
["Do you think it's important to disconnect from technology sometimes?", "inter", "Yes, I think it's genuinely important.", "Constant connectivity can be mentally exhausting over time.", "For example, I try to avoid my phone for an hour before bed. Friends who know me well aren't surprised by that at all.", "So I believe small breaks make a real difference."],
["What is your favorite way to meet new people?", "easy", "My favorite way is through shared hobbies or activities.", "It's easier to connect when you already have something in common.", "For example, I met several friends through a local sports club. It's become a bit of a personal tradition at this point.", "So shared interests are usually how I meet people."],
["Do you prefer studying alone or in a group?", "easy", "I prefer studying alone.", "I can focus better without distractions from other people.", "For example, I get much more done in a quiet room by myself. I doubt I'll change that habit anytime soon, honestly.", "So solo study sessions work best for me."],
["What is your opinion on gap years before university?", "inter", "I think gap years can be genuinely valuable.", "They give students time to gain experience and clarify their goals.", "For example, I know people who used the time to travel or work. It's a small detail, but it makes an ordinary day feel a bit better.", "So I think it's a reasonable option for many students."],
["Do you enjoy trying street food?", "easy", "Yes, I really enjoy trying street food.", "It often has the most authentic and flavorful dishes.", "For example, some of my favorite meals have come from small street stalls. That's stayed consistent for me even as other things in my life have changed.", "So street food is always something I look forward to."],
["What is a piece of technology you couldn't live without?", "easy", "A piece of technology I couldn't live without is my phone.", "It handles everything from communication to navigation for me.", "For example, I use it constantly throughout the day for different tasks. It's the kind of thing that seems minor until you try going without it.", "So it's become an essential part of my daily life."],
["Do you think it's necessary to learn how to drive?", "inter", "I think it depends on where you live.", "In cities with good public transport, it may not be essential.", "For example, I rarely need to drive since I live near a metro line. I've recommended it to a few people, and most of them agree.", "So its necessity really depends on your location."],
["What is your favorite way to unwind after studying?", "easy", "My favorite way to unwind is taking a short walk.", "It clears my head after hours of concentrating.", "For example, I usually walk around the block after a study session. It's genuinely one of the more reliable parts of my routine.", "So it's become a simple but effective habit."],
["Do you think it's important to keep learning as an adult?", "inter", "Yes, I think lifelong learning is very important.", "It keeps the mind active and opens up new opportunities.", "For example, I recently started an online course just out of interest. Over time, it's become less of a choice and more of a habit.", "So I believe learning shouldn't stop after school."],
["What is your favorite way to spend a birthday?", "easy", "My favorite way is a small gathering with close friends.", "I prefer meaningful time together over a big party.", "For example, my last birthday was a quiet dinner with a few friends. That's probably the closest thing I have to a daily ritual.", "So small and personal is what I enjoy most."],
["Do you enjoy taking care of plants?", "easy", "Yes, I enjoy taking care of plants.", "It's a calming hobby that also improves my living space.", "For example, I've been growing a few herbs on my balcony. It's a preference I've had for years, and it hasn't really faded.", "So gardening has become a relaxing part of my routine."],
["What is your opinion on remote team meetings?", "inter", "I think they're convenient but sometimes less effective.", "It can be harder to read body language and stay engaged.", "For example, I've noticed meetings run longer online than in person. I suspect most people have something similar, even if they don't talk about it.", "So I think a mix of both formats works best."],
["Do you enjoy reading books in your free time?", "easy", "Yes, I really enjoy reading in my free time.", "It helps me relax and learn new things at the same time.", "For example, I usually read a novel before bed each night. It's a small thing, but it genuinely adds up over time.", "So reading has become one of my favorite habits."],
["What kind of music do you usually listen to?", "easy", "I usually listen to pop and acoustic music.", "It has a relaxing rhythm that suits my mood most days.", "For example, I often play it while studying or commuting. That consistency is honestly what makes it feel meaningful rather than random.", "So it's become part of my daily routine."],
["Do you prefer watching movies at home or at the cinema?", "easy", "I prefer watching movies at home.", "It's more comfortable and I can pause whenever I like.", "For example, I can make my own snacks and relax on the sofa. It's become something I look forward to without really thinking about it anymore.", "So home has become my usual choice for movie nights."],
["What is your favorite way to exercise?", "easy", "My favorite way to exercise is swimming.", "It's gentle on the joints but still a full workout.", "For example, I try to swim at least twice a week. Looking back, it's a habit I probably wouldn't give up easily.", "So swimming has become a key part of staying fit for me."],
["Do you like cooking for yourself or others?", "easy", "Yes, I really enjoy cooking for others.", "It's a nice way to show care and bring people together.", "For example, I often cook a big meal when friends visit. It's surprising how much of a difference something that simple can make.", "So cooking has become a meaningful part of hosting for me."],
["What is your favorite public holiday?", "easy", "My favorite public holiday is Tet.", "It's the one time of year the whole family gathers together.", "For example, we always cook traditional food and visit relatives. That routine has quietly shaped a lot of how I structure my week.", "So Tet is the holiday I look forward to most."],
["Do you enjoy shopping?", "easy", "I enjoy shopping, but only occasionally.", "It can be fun, though I don't like crowded places.", "For example, I prefer shopping online to avoid busy stores. I've noticed it genuinely affects my mood on the days I skip it.", "So shopping is something I do in moderation."],
["What is your favorite type of weather?", "easy", "My favorite type of weather is mild and sunny.", "It's perfect for spending time outdoors comfortably.", "For example, I love going for walks on days like that. It's one of those small preferences that says more about me than I'd expect.", "So that kind of weather always lifts my mood."],
["Do you like taking photographs?", "easy", "Yes, I enjoy taking photographs, especially outdoors.", "It helps me capture and remember special moments.", "For example, I always take pictures when I travel somewhere new. Friends who know me well aren't surprised by that at all.", "So photography has become a nice hobby for me."],
["What is your favorite subject to talk about with friends?", "easy", "I like talking about travel with my friends.", "We all enjoy sharing stories and planning future trips together.", "For example, we often show each other photos from past trips. It's become a bit of a personal tradition at this point.", "So travel is a topic that always sparks a good conversation."],
["Do you prefer spending money or saving it?", "inter", "I try to balance spending and saving.", "It's important to enjoy life now while still planning ahead.", "For example, I save a fixed amount each month before spending the rest. I doubt I'll change that habit anytime soon, honestly.", "So I aim for a practical balance between the two."],
["What kind of transportation do you use most often?", "easy", "I mostly use a motorbike to get around.", "It's fast and convenient for navigating the city.", "For example, it only takes me fifteen minutes to get to work. It's a small detail, but it makes an ordinary day feel a bit better.", "So it's by far my most practical option."],
["Do you enjoy learning new languages?", "easy", "Yes, I really enjoy learning new languages.", "It opens up new ways to connect with different cultures.", "For example, I've been learning English for a few years now. That's stayed consistent for me even as other things in my life have changed.", "So language learning has become an ongoing interest of mine."],
["What is your favorite way to relax after a long day?", "easy", "My favorite way to relax is listening to music.", "It helps me clear my mind after a busy day.", "For example, I usually put on calm music while lying down. It's the kind of thing that seems minor until you try going without it.", "So it's the easiest way for me to unwind."],
["Do you like spending time near water, like a lake or the sea?", "easy", "Yes, I love spending time near water.", "It has a calming effect that helps me relax.", "For example, I try to visit the beach whenever I get the chance. I've recommended it to a few people, and most of them agree.", "So being near water is something I always enjoy."],
["What is a skill you would like to learn in the future?", "inter", "I would like to learn how to play the guitar.", "It seems like a rewarding and creative skill to have.", "For example, I've always admired people who can play at gatherings. It's genuinely one of the more reliable parts of my routine.", "So it's a goal I hope to pursue eventually."],
["Do you prefer working in the morning or at night?", "easy", "I prefer working in the morning.", "My mind feels clearer and more focused earlier in the day.", "For example, I get much more done before noon than after. Over time, it's become less of a choice and more of a habit.", "So mornings are definitely my most productive time."],
["What kind of gifts do you like to give?", "easy", "I like giving thoughtful, personal gifts.", "It shows that I've really considered what the person likes.", "For example, I once made a photo album for a close friend. That's probably the closest thing I have to a daily ritual.", "So the effort behind a gift matters more to me than the price."],
["Do you enjoy spending time alone?", "easy", "Yes, I enjoy spending time alone sometimes.", "It gives me a chance to recharge and think clearly.", "For example, I like to spend Sunday mornings alone with a book. It's a preference I've had for years, and it hasn't really faded.", "So alone time is something I value regularly."],
["What is your opinion on keeping pets?", "easy", "I think keeping pets is a wonderful experience.", "They provide companionship and can reduce stress significantly.", "For example, my dog always cheers me up after a hard day. I suspect most people have something similar, even if they don't talk about it.", "So I'd recommend having a pet to almost anyone."],
["Do you think it's important to learn how to cook?", "inter", "Yes, I think it's an important life skill.", "It allows people to eat healthier and save money.", "For example, cooking at home is usually cheaper than eating out. It's a small thing, but it genuinely adds up over time.", "So I believe everyone should learn at least the basics."],
["What is your favorite place to study or work?", "easy", "My favorite place to study is the library.", "It's quiet, which helps me concentrate better than at home.", "For example, I get much more done there in a shorter time. That consistency is honestly what makes it feel meaningful rather than random.", "So it's become my go-to spot for focused work."],
["Do you prefer written communication or talking in person?", "inter", "I generally prefer talking in person.", "It's easier to express tone and avoid misunderstandings.", "For example, sensitive topics are always better discussed face-to-face. It's become something I look forward to without really thinking about it anymore.", "So I choose in-person conversation whenever possible."],
["What is your favorite childhood memory?", "easy", "One of my favorite memories is a family trip to the beach.", "It was one of the first times we all traveled together.", "For example, I still remember building sandcastles with my siblings. Looking back, it's a habit I probably wouldn't give up easily.", "So that trip remains a special memory for me."],
["Do you think it's important to try new experiences?", "inter", "Yes, I think trying new experiences is important.", "It helps people grow and discover what they truly enjoy.", "For example, trying a new hobby last year completely changed my routine. It's surprising how much of a difference something that simple can make.", "So I try to step outside my comfort zone when I can."],
["What is your favorite way to spend a rainy day?", "easy", "My favorite way to spend a rainy day is watching movies.", "It feels cozy, especially when paired with a warm drink.", "For example, I often use rainy days to catch up on a series. That routine has quietly shaped a lot of how I structure my week.", "So rain doesn't bother me much anymore."],
["Do you enjoy attending live events, like concerts or festivals?", "easy", "Yes, I really enjoy attending live events.", "The energy of a crowd makes the experience more exciting.", "For example, I went to a music festival last year and loved it. I've noticed it genuinely affects my mood on the days I skip it.", "So I try to attend live events whenever I can."],
["What is one habit you would like to improve?", "inter", "One habit I'd like to improve is my sleep schedule.", "Going to bed late has been affecting my energy levels.", "For example, I've been trying to set a fixed bedtime recently. It's one of those small preferences that says more about me than I'd expect.", "So it's something I'm actively working on."],
["Do you prefer planning things in advance or being spontaneous?", "inter", "I generally prefer planning things in advance.", "It helps me feel more prepared and less stressed.", "For example, I usually plan my week every Sunday evening. Friends who know me well aren't surprised by that at all.", "So structure works better for me than spontaneity."],
["What is your favorite thing about your daily commute?", "easy", "My favorite thing about my commute is the quiet time.", "It gives me a moment to think before the day starts.", "For example, I often listen to a podcast during the ride. It's become a bit of a personal tradition at this point.", "So I actually look forward to that part of my day."],
["Do you think city life is better than countryside life?", "easy", "I think city life offers more advantages for most people.", "Cities provide better job opportunities and access to services.", "For example, it's much easier to find work and public transport in a city. I doubt I'll change that habit anytime soon, honestly.", "So overall, cities tend to offer a higher quality of life for many."],
["How has technology changed the way people communicate in society?", "inter", "Technology has made communication much faster and more constant.", "People no longer need to wait days for a letter or a phone call.", "For example, families can now video call across the world instantly. It's a small detail, but it makes an ordinary day feel a bit better.", "So communication has become instant, though sometimes less personal."],
["What are the advantages and disadvantages of social media for young people?", "inter", "Social media has both positive and negative effects on young people.", "It helps them stay connected, but it can also affect their mental health.", "For example, constant comparison online often leads to lower self-esteem. That's stayed consistent for me even as other things in my life have changed.", "So it's important for young people to use it in moderation."],
["Do you think traditional customs are dying out in modern society?", "inter", "I think some traditional customs are gradually fading.", "Younger generations are more influenced by global culture than local traditions.", "For example, fewer young people know how to perform traditional festival rituals. It's the kind of thing that seems minor until you try going without it.", "So without effort to preserve them, many customs may disappear."],
["How important is it for governments to protect the environment?", "inter", "I believe it's extremely important for governments to take action.", "Individuals alone can't solve large-scale environmental problems.", "For example, only governments can enforce laws on factory emissions. I've recommended it to a few people, and most of them agree.", "So strong government policies are essential for real change."],
["Do you believe children today have more opportunities than in the past?", "inter", "Yes, I believe children today have far more opportunities.", "Access to information and education has expanded enormously.", "For example, children can now learn new skills online for free. It's genuinely one of the more reliable parts of my routine.", "So today's generation has more paths open to them than before."],
["What impact does tourism have on local communities?", "inter", "Tourism can have both positive and negative impacts on local communities.", "It brings income, but it can also raise living costs for residents.", "For example, house prices often rise sharply in popular tourist areas. Over time, it's become less of a choice and more of a habit.", "So tourism needs to be managed carefully to benefit everyone."],
["Should governments invest more in public transportation?", "easy", "Yes, I think governments should invest more in public transportation.", "It reduces traffic congestion and pollution in cities.", "For example, cities with good subway systems have less road traffic. That's probably the closest thing I have to a daily ritual.", "So better public transport benefits both the environment and daily life."],
["Do you think working from home will become more common in the future?", "inter", "Yes, I think remote work will continue to grow.", "Companies have realized it can be just as productive as office work.", "For example, many businesses now offer permanent remote positions. It's a preference I've had for years, and it hasn't really faded.", "So working from home is likely to become a standard option."],
["How does globalization affect local cultures?", "inter", "Globalization has a mixed effect on local cultures.", "It spreads awareness of them, but also introduces outside influences.", "For example, international fast food chains often replace local restaurants. I suspect most people have something similar, even if they don't talk about it.", "So local cultures need protection to survive global influence."],
["Is it better for people to specialize in one skill or have many skills?", "inter", "I think having a mix of skills is generally more valuable today.", "The job market is changing quickly, so flexibility matters.", "For example, workers who can adapt to new tools stay employed longer. It's a small thing, but it genuinely adds up over time.", "So being adaptable is often more useful than deep specialization alone."],
["Do you think advertising influences what people buy?", "easy", "Yes, I think advertising strongly influences people's choices.", "It creates desire for products people didn't originally need.", "For example, many people buy trendy items just because of online ads. That consistency is honestly what makes it feel meaningful rather than random.", "So advertising plays a big role in everyday spending habits."],
["Should university education be free for everyone?", "inter", "I think university education should be more affordable, if not free.", "High costs prevent many talented students from attending.", "For example, some students give up their studies due to financial pressure. It's become something I look forward to without really thinking about it anymore.", "So reducing costs would create more equal opportunities for everyone."],
["How can society help reduce the gap between rich and poor?", "inter", "Society can help by improving access to education and healthcare.", "These are the areas where inequality has the biggest long-term impact.", "For example, free healthcare prevents poor families from falling into debt. Looking back, it's a habit I probably wouldn't give up easily.", "So investing in basic services helps narrow the wealth gap over time."],
["Do you think artificial intelligence will replace human jobs?", "inter", "I think AI will replace some jobs but also create new ones.", "Technology tends to shift the type of work rather than remove it entirely.", "For example, factory jobs decreased, but tech and AI jobs increased. It's surprising how much of a difference something that simple can make.", "So the job market will change, but not necessarily shrink overall."],
["What are the benefits of learning a foreign language in today's world?", "easy", "Learning a foreign language offers many personal and career benefits.", "It opens up opportunities that wouldn't otherwise be available.", "For example, bilingual employees are often preferred for international roles. That routine has quietly shaped a lot of how I structure my week.", "So a second language is a valuable skill in today's globalized world."],
["Should older people be encouraged to keep working after retirement age?", "inter", "I think it should be a personal choice rather than a requirement.", "Some people want to stay active, while others need rest.", "For example, many retirees choose part-time work just to stay engaged. I've noticed it genuinely affects my mood on the days I skip it.", "So flexibility is more important than a fixed rule for everyone."],
["Do you think fast food is a serious problem for public health?", "easy", "Yes, I think fast food is a significant public health concern.", "It's often high in fat and sugar, which leads to health issues.", "For example, rates of obesity have risen alongside fast food consumption. It's one of those small preferences that says more about me than I'd expect.", "So it's a problem that deserves more public attention."],
["How does climate change affect people's daily lives?", "inter", "Climate change is already affecting daily life in many ways.", "Extreme weather is becoming more frequent and unpredictable.", "For example, heatwaves and floods now disrupt schools and workplaces. Friends who know me well aren't surprised by that at all.", "So its effects are no longer distant or theoretical."],
["Is it important for children to learn about their own culture and history?", "easy", "Yes, I think it's very important for children to learn this.", "It helps them understand their identity and community.", "For example, children who know local history often feel more connected to home. It's become a bit of a personal tradition at this point.", "So cultural education plays a key role in a child's development."],
["Do you think people are becoming less social because of smartphones?", "inter", "I think smartphones have changed the way people socialize.", "People often interact online instead of face-to-face now.", "For example, groups of friends sometimes sit together while looking at their phones. I doubt I'll change that habit anytime soon, honestly.", "So social habits have shifted, even if people are still connected."],
["Should companies be responsible for their employees' wellbeing?", "inter", "Yes, I believe companies should take employee wellbeing seriously.", "A healthy workforce is more productive and loyal in the long run.", "For example, companies offering mental health support often see lower staff turnover. It's a small detail, but it makes an ordinary day feel a bit better.", "So it benefits both employees and the business overall."],
["Do you think competition is good for society?", "inter", "I think competition can be good, but only to a certain extent.", "It encourages people to improve, but too much can cause stress.", "For example, competitive workplaces sometimes lead to burnout. That's stayed consistent for me even as other things in my life have changed.", "So a healthy balance of competition and cooperation works best."],
["How can cities become more environmentally friendly?", "inter", "Cities can become greener by investing in public transport and green spaces.", "These changes reduce pollution and improve residents' quality of life.", "For example, cities with more bike lanes often have lower emissions. It's the kind of thing that seems minor until you try going without it.", "So thoughtful urban planning is key to a cleaner future."],
["Do you believe money can buy happiness?", "easy", "I think money helps, but it can't fully buy happiness.", "It removes stress about basic needs, but happiness depends on more than that.", "For example, relationships and health matter just as much as income. I've recommended it to a few people, and most of them agree.", "So money is only one part of a happy life."],
["Should schools teach more practical life skills?", "easy", "Yes, I think schools should teach more practical life skills.", "Many students leave school without knowing how to manage daily tasks.", "For example, few students learn about budgeting or taxes before graduating. It's genuinely one of the more reliable parts of my routine.", "So adding these skills would better prepare students for adulthood."],
["Is it better to live in a big family or a small family in modern society?", "inter", "I think smaller families tend to suit modern lifestyles better.", "They're generally easier to support financially and logistically.", "For example, smaller families often have lower living costs per person. Over time, it's become less of a choice and more of a habit.", "So while both have benefits, smaller families are becoming more common."],
["Do you think online shopping will replace traditional shopping?", "inter", "I think online shopping will continue to grow, but not fully replace stores.", "Some people still value the experience of shopping in person.", "For example, many shoppers prefer trying on clothes before buying them. That's probably the closest thing I have to a daily ritual.", "So both will likely continue to exist side by side."],
["How important is creativity in the modern workplace?", "inter", "I think creativity is becoming increasingly important at work.", "Many routine tasks are now automated, so creative thinking stands out.", "For example, companies value employees who can solve problems in new ways. It's a preference I've had for years, and it hasn't really faded.", "So creativity has become a key skill in many modern jobs."],
["Do you think people should travel more to understand other cultures?", "easy", "Yes, I think traveling is one of the best ways to understand other cultures.", "Experiencing a culture firsthand teaches more than reading about it.", "For example, trying local food and customs builds real understanding. I suspect most people have something similar, even if they don't talk about it.", "So travel can be a valuable form of cultural education."],
["What is your hometown like?", "easy", "My hometown is a small, peaceful city in the countryside.", "I like it because life there is calm and unhurried.", "For example, people still greet each other on the street. It's a small thing, but it genuinely adds up over time.", "So overall, it's a comfortable place to live."],
["Do you like your hometown?", "easy", "Yes, I really like my hometown.", "It has everything I need without feeling too crowded.", "For instance, the market and school are within walking distance. That consistency is honestly what makes it feel meaningful rather than random.", "That's why I feel attached to this place."],

const VOCAB_VN = Object.assign({}, GENERIC_VN, SPECIFIC_VN);
function highlightVN(text, max){
  max = max || 4;
  const premiumWords = Object.keys(PREMIUM_VN).sort((a,b)=>b.length-a.length);
  const specificWords = Object.keys(SPECIFIC_VN).sort((a,b)=>b.length-a.length);
  const genericWords = Object.keys(GENERIC_VN).sort((a,b)=>b.length-a.length);
  const premiumRegex = new RegExp('\\b(' + premiumWords.join('|') + ')\\b', 'gi');
  const specificRegex = new RegExp('\\b(' + specificWords.join('|') + ')\\b', 'gi');
  const genericRegex = new RegExp('\\b(' + genericWords.join('|') + ')\\b', 'gi');

  const seen = new Set();
  let count = 0;

  // Pass 1: prioritize genuinely rare/impressive B1-C1 vocabulary
  let result = text.replace(premiumRegex, (match)=>{
    const key = match.toLowerCase();
    if(seen.has(key) || count >= max) return match;
    seen.add(key); count++;
    return `<mark class="vn-highlight">${match}<span class="vn-def">${PREMIUM_VN[key]}</span></mark>`;
  });

  // Pass 2: fill remaining slots with topic-specific vocabulary
  if(count < max){
    result = result.replace(specificRegex, (match)=>{
      const key = match.toLowerCase();
      if(seen.has(key) || count >= max) return match;
      seen.add(key); count++;
      return `<mark class="vn-highlight">${match}<span class="vn-def">${SPECIFIC_VN[key]}</span></mark>`;
    });
  }

  // Pass 3: only fill remaining slots with generic connector words if needed
  if(count < max){
    result = result.replace(genericRegex, (match)=>{
      const key = match.toLowerCase();
      if(seen.has(key) || count >= max) return match;
      seen.add(key); count++;
      return `<mark class="vn-highlight">${match}<span class="vn-def">${GENERIC_VN[key]}</span></mark>`;
    });
  }
  return result;
}

function makeBag(len){
  const arr=[...Array(len).keys()];
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function rebuildPool(deckKey){
  const d = decks[deckKey];
  const f = FILTERS[deckKey];
  d.pool = d.data.filter(item=>f.test(item, d.level));
  d.bag = makeBag(d.pool.length);
  d.drawn = 0;
}

function nextIndex(deckKey){
  const d = decks[deckKey];
  if(d.bag.length === 0){
    d.bag = makeBag(d.pool.length);
    d.drawn = 0;
  }
  d.drawn++;
  return d.bag.pop();
}

  const bag = makeBag(pool.length);
  return bag.slice(0, n).map(i => pool[i]);
}

    </div>
    <p class="meaning">${meaning}</p>
    <div class="gram-block">
      <div class="gram-title">${pattern.title}</div>
      <div class="gram-formula">${pattern.formula}</div>
      <div class="gram-task">✏️ Make a new sentence using <strong>"${word}"</strong> + this structure</div>
      <button class="gram-ex-toggle" onclick="const w=this.nextElementSibling; w.classList.toggle('show'); this.textContent = w.classList.contains('show') ? 'Hide example' : 'Show example';">Show example</button>
      <div class="gram-ex-wrap"><span class="gram-ex">e.g. ${gEx}</span></div>
    </div>
  `;
}

const renderers = { social: renderSocial, ielts: renderIelts, roleplay: renderRoleplay, question: renderQuestion, vocab: renderVocab };

const timerBtn = document.getElementById('timerBtn');
let timerInterval = null;
let timerSeconds = 0;

function stopTimer(){
  clearInterval(timerInterval);
  timerInterval = null;
  timerBtn.classList.remove('running');
  timerBtn.textContent = '⏱';
  timerSeconds = 0;
}
function startTimer(){
  clearInterval(timerInterval);
  timerSeconds = 0;
  timerBtn.classList.add('running');
  timerBtn.textContent = '0:00';
  timerInterval = setInterval(()=>{
    timerSeconds++;
    const m = Math.floor(timerSeconds/60);
    const s = String(timerSeconds%60).padStart(2,'0');
    timerBtn.textContent = `${m}:${s}`;
  }, 1000);
}
timerBtn.addEventListener('click', ()=>{
  if(timerInterval) stopTimer(); else startTimer();
});

drawBtn.addEventListener('click', ()=>{
  drawBtn.classList.remove('spin');
  void drawBtn.offsetWidth;
  drawBtn.classList.add('spin');
  ticketEl.classList.remove('show');
  placeholderEl.style.display = 'none';
  renderers[currentTab]();
  void ticketEl.offsetWidth;
  ticketEl.classList.add('show');
  updateCounter();
  startTimer();
});

tabTipEl.textContent = TIPS[currentTab];
renderLevelRow();
updateCounter();
</script>
</body>
</html>
