<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalkSpark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EAF4FE;
    --panel:#FFFFFF;
    --panel-line:#DCEEFB;
    --yellow:#FFCB4D;
    --yellow-deep:#F5A926;
    --blue:#5B9BEE;
    --blue-deep:#2F6FBF;
    --ink:#1E3A5F;
    --muted:#8CA6C2;
    --muted-light:#4A6E96;
    --paper:#FFFDF6;
    --paper-edge:#FFE4A0;
    --text-body:#3A5470;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 15% -10%, #FFF3D2 0%, transparent 55%),
      radial-gradient(ellipse at 100% 110%, #B9DBFF 0%, transparent 65%),
      var(--bg);
    min-height:100vh;
    font-family:'Nunito',sans-serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:40px 16px;
  }
  .wrap{width:100%;max-width:1320px;}
  .layout{display:flex;gap:40px;align-items:stretch;}
  .left-col{flex:0 0 290px;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;}
  .right-col{flex:1;min-width:0;}

  /* ---------- Header ---------- */
  header{text-align:center;position:relative;}
  .eyebrow{
    font-family:'Nunito',sans-serif;font-weight:800;
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--blue-deep);margin-bottom:10px;
  }
  h1{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:clamp(42px,6.2vw,64px);
    line-height:1.0;
    margin:0 0 24px;
    color:var(--ink);
    overflow-wrap:break-word;
  }
  h1 em{color:var(--blue-deep);font-style:normal;}
  .sub-line{
    display:flex;align-items:center;gap:10px;
    color:var(--blue-deep);font-size:19px;font-weight:800;
    max-width:270px;margin:0 auto 8px;line-height:1.3;
  }
  .sub-num{
    flex-shrink:0;width:24px;height:24px;border-radius:50%;
    background:var(--yellow);color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:13px;
  }

  /* ---------- Title decoration ---------- */
  .spark-wrap{position:relative;display:inline-block;}
  .underline-svg{
    position:absolute;left:2px;bottom:-12px;width:100%;height:18px;
    pointer-events:none;
  }
  .spark-icon{
    position:absolute;
    font-size:20px;line-height:1;
    color:var(--yellow-deep);
    pointer-events:none;
    user-select:none;
  }
  .spark-icon-1{top:-10px;right:-30px;font-size:28px;transform:rotate(8deg);}
  .spark-icon-2{top:10px;right:28px;color:var(--blue);font-size:20px;opacity:.7;}
  .spark-icon-3{bottom:80px;left:0px;color:var(--yellow-deep);font-size:18px;opacity:.6;}
  .spark-icon-4{top:-36px;left:20px;color:var(--blue);font-size:16px;opacity:.55;}
  .spark-icon-5{bottom:20px;right:-10px;color:var(--yellow-deep);font-size:15px;opacity:.5;}
  .spark-icon-6{top:40%;left:-34px;color:var(--blue);font-size:14px;opacity:.4;}

  .amb{position:absolute;pointer-events:none;user-select:none;}
  .amb-1{top:6%;left:18%;font-size:15px;color:var(--blue);opacity:.45;}
  .amb-2{top:14%;right:8%;font-size:12px;color:var(--yellow-deep);opacity:.5;}
  .amb-3{bottom:14%;left:6%;font-size:13px;color:var(--yellow-deep);opacity:.4;}
  .amb-4{bottom:20%;right:16%;font-size:16px;color:var(--blue);opacity:.4;}
  .amb-5{top:38%;left:2%;font-size:11px;color:var(--blue);opacity:.35;}
  .amb-6{bottom:6%;right:30%;font-size:12px;color:var(--yellow-deep);opacity:.35;}

  @media (max-width:460px){
    .layout{flex-direction:column;gap:20px;}
    .left-col{flex:none;}
    h1{font-size:clamp(36px,10vw,52px);}
    .sub-line{max-width:420px;font-size:16px;}
  }

  /* ---------- Tabs (pill capsule) ---------- */
  .tabs{
    display:flex;flex-wrap:nowrap;gap:6px;
    background:#EDEDED;
    padding:9px;border-radius:24px;
    margin-bottom:28px;
  }
  .tab{
    flex:1 1 0;
    min-width:0;
    background:transparent;
    border:none;
    border-radius:18px;
    padding:15px 10px;
    text-align:center;
    cursor:pointer;
    font-family:'Nunito',sans-serif;
    font-weight:800;
    font-size:16px;
    color:var(--muted-light);
    letter-spacing:.01em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    transition:all .18s ease;
    user-select:none;
  }
  .tab:hover{color:var(--ink);}
  .tab.active{
    background:var(--panel);
    color:var(--ink);
    box-shadow:0 3px 10px -4px rgba(30,58,95,0.25);
  }

  /* ---------- Machine panel ---------- */
  .machine{
    background:var(--panel);
    border-radius:30px;
    padding:36px 32px 32px;
    box-shadow:inset 0 0 0 1px var(--panel-line), 0 24px 50px -28px rgba(47,111,191,0.35);
  }
  .machine-head{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:26px;gap:10px;
  }
  .machine-title{
    font-family:'Baloo 2',sans-serif;font-weight:600;font-size:19px;color:var(--ink);
  }
  .machine-title .dot{color:var(--blue-deep);margin-right:6px;}
  .tab-tip{
    font-family:'Nunito',sans-serif;font-weight:700;font-size:12.5px;
    color:var(--blue-deep);margin:8px 0 18px;line-height:1.5;
    display:flex;align-items:flex-start;gap:6px;
    background:rgba(91,155,238,0.12);
    border:1.5px dashed rgba(91,155,238,0.4);
    border-radius:12px;
    padding:10px 14px;
  }

  /* ---------- Ticket ---------- */
  .stage{
    position:relative;
    min-height:340px;
    display:flex;align-items:center;justify-content:center;
    perspective:1200px;
    margin-bottom:28px;
    border-top:1.5px dashed var(--panel-line);
    border-bottom:1.5px dashed var(--panel-line);
  }
  .placeholder{
    text-align:center;color:var(--muted);font-size:16px;font-weight:700;line-height:1.7;
    padding:30px 20px;
  }
  .placeholder .cap{display:block;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--yellow-deep);margin-bottom:14px;opacity:.8;}
  .placeholder .big{display:block;font-size:40px;margin-bottom:14px;}

  .ticket{
    display:none;
    position:relative;
    width:100%;
    background:var(--paper);
    color:var(--ink);
    border-radius:18px;
    padding:22px 22px 20px;
    animation:draw .5s cubic-bezier(.2,.8,.25,1);
    box-shadow:0 18px 40px -18px rgba(47,111,191,0.4);
  }
  .ticket.show{display:block;}
  @keyframes draw{
    0%{opacity:0;transform:translateY(18px) rotate(-2.5deg) scale(.96);}
    60%{opacity:1;}
    100%{opacity:1;transform:translateY(0) rotate(0) scale(1);}
  }
  .ticket::before,.ticket::after{
    content:"";position:absolute;top:50%;width:22px;height:22px;
    background:var(--panel);border-radius:50%;transform:translateY(-50%);
  }
  .ticket::before{left:-11px;}
  .ticket::after{right:-11px;}
  .perf{
    position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;
  }
  .ticket-top{
    display:flex;justify-content:space-between;align-items:flex-start;
    border-bottom:1.5px dashed var(--paper-edge);
    padding-bottom:12px;margin-bottom:14px;
  }
  .ticket-tag{
    font-family:'Nunito',sans-serif;font-size:10.5px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--blue-deep);font-weight:800;
    background:rgba(91,155,238,0.12);padding:4px 9px;border-radius:6px;
  }
  .ticket-no{
    font-family:'Nunito',sans-serif;font-weight:700;font-size:11px;color:var(--muted);
  }
  .ticket-topic{
    font-family:'Baloo 2',sans-serif;font-weight:600;font-size:27px;line-height:1.32;
    margin:0 0 16px;
  }
  .hints{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;}
  .hints li{
    font-size:16.5px;font-weight:600;line-height:1.5;color:var(--text-body);
    padding-left:20px;position:relative;
  }
  .hints li::before{
    content:"–";position:absolute;left:0;color:var(--blue-deep);font-weight:800;
  }
  .word-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
  .word{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:34px;}
  .pos{font-family:'Nunito',sans-serif;font-size:13px;color:var(--blue-deep);font-weight:800;}
  .meaning{font-size:17px;font-weight:600;color:var(--text-body);margin-bottom:16px;}
  .gram-block{
    background:rgba(91,155,238,0.07);border:1px dashed var(--paper-edge);
    border-radius:12px;padding:12px 14px;
  }
  .gram-title{
    font-family:'Nunito',sans-serif;font-weight:800;font-size:12.5px;
    color:var(--blue-deep);text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px;
  }
  .gram-formula{
    font-family:'Baloo 2',sans-serif;font-weight:600;font-size:15px;
    color:var(--ink);line-height:1.5;margin-bottom:8px;
  }
  .gram-desc{font-size:13.5px;color:var(--text-body);line-height:1.55;}
  .gram-ex{font-family:'Nunito',sans-serif;font-weight:700;font-size:12.5px;color:#5B7593;}
  .vn-highlight{
    background:rgba(245,169,38,0.25);
    padding:1px 3px;border-radius:5px;
    font-weight:800;color:var(--ink);
  }
  .vn-def{
    font-family:'Nunito',sans-serif;font-weight:700;font-size:10.5px;
    color:var(--blue-deep);margin-left:3px;
  }
  .vn-def::before{content:"(";}
  .vn-def::after{content:")";}
  .gram-ex-toggle{
    background:linear-gradient(180deg,var(--yellow) 0%,var(--yellow-deep) 100%);
    border:none;color:var(--ink);
    font-family:'Nunito',sans-serif;font-size:12.5px;font-weight:800;
    padding:8px 18px;border-radius:999px;cursor:pointer;margin-top:2px;
    box-shadow:0 6px 14px -6px rgba(245,169,38,0.6);
    transition:transform .12s ease;
  }
  .gram-ex-toggle:hover{transform:translateY(-1px);}
  .gram-ex-wrap{display:none;margin-top:8px;}
  .script-scroll{
    max-height:260px;overflow-y:auto;
    padding-right:6px;
  }
  .script-scroll::-webkit-scrollbar{width:6px;}
  .script-scroll::-webkit-scrollbar-thumb{background:var(--panel-line);border-radius:999px;}
  .gram-ex-wrap.show{display:block;}
  .prep-line{
    display:flex;gap:8px;align-items:baseline;
    font-family:'Nunito',sans-serif;font-weight:600;font-size:13.5px;
    color:var(--text-body);line-height:1.5;margin-bottom:8px;
  }
  .prep-tag{
    flex-shrink:0;width:78px;
    font-family:'Nunito',sans-serif;font-weight:800;font-size:10.5px;
    letter-spacing:.03em;text-transform:uppercase;color:var(--blue-deep);
  }
  .phrase-block{margin-bottom:10px;}
  .gram-task{
    display:flex;align-items:center;gap:6px;
    font-family:'Nunito',sans-serif;font-weight:800;font-size:12px;
    color:var(--blue-deep);margin-top:12px;padding-top:10px;
    border-top:1px dashed var(--paper-edge);
  }

  /* ---------- Role play ---------- */
  .roles{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
  .role-item{display:flex;gap:10px;align-items:flex-start;}
  .role-badge{
    flex-shrink:0;width:24px;height:24px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:12px;color:#fff;
    margin-top:1px;
  }
  .role-badge.b0{background:var(--blue);}
  .role-badge.b1{background:var(--yellow-deep);}
  .role-badge.b2{background:#3FA7A0;}
  .role-text{font-size:13.5px;font-weight:600;line-height:1.5;color:var(--text-body);}
  .script-line{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;}
  .script-text{font-size:13.5px;font-weight:600;line-height:1.5;color:var(--ink);padding-top:1px;}
  .role-text strong{color:var(--ink);}

  /* ---------- Level / People selector (dropdown pill) ---------- */
  .level-row{flex-shrink:0;}
  .level-select{position:relative;height:100%;}
  .level-select-btn{
    height:100%;
    display:flex;align-items:center;gap:8px;
    background:#EDEDED;
    border:1.5px solid var(--panel-line);
    border-radius:999px;
    padding:0 18px;
    cursor:pointer;
    font-family:'Nunito',sans-serif;
    font-weight:800;
    font-size:14px;
    color:var(--ink);
    white-space:nowrap;
    transition:border-color .15s ease;
  }
  .level-select-btn:hover{border-color:var(--blue);}
  .timer-btn{
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    min-width:52px;height:auto;
    background:#EDEDED;border:1.5px solid var(--panel-line);
    border-radius:999px;
    font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;
    color:var(--ink);cursor:pointer;padding:0 12px;
    transition:border-color .15s ease, background .15s ease;
  }
  .timer-btn:hover{border-color:var(--blue);}
  .timer-btn.running{background:var(--blue);border-color:var(--blue);color:#fff;}
  .level-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .level-select-btn .chevron{font-size:9px;color:var(--muted);margin-left:1px;transition:transform .15s ease;}
  .level-select.open .chevron{transform:rotate(180deg);}
  .level-menu{
    display:none;
    position:absolute;bottom:calc(100% + 8px);right:0;
    background:var(--panel);
    border:1.5px solid var(--panel-line);
    border-radius:14px;
    padding:6px;
    min-width:170px;
    box-shadow:0 16px 34px -14px rgba(30,58,95,0.4);
    z-index:10;
  }
  .level-menu.open{display:block;}
  .level-option{
    display:flex;align-items:center;gap:9px;
    padding:9px 10px;border-radius:10px;
    cursor:pointer;
    font-family:'Nunito',sans-serif;font-weight:700;font-size:12.5px;
    color:var(--ink);
    transition:background .12s ease;
  }
  .level-option:hover{background:#EDF3FA;}
  .level-option.active{background:rgba(91,155,238,0.14);color:var(--blue-deep);}

  /* ---------- Draw button ---------- */
  .draw-row{display:flex;gap:10px;align-items:stretch;justify-content:center;}
  .draw-btn{
    flex:1;
    background:linear-gradient(180deg,#FFDD85 0%,var(--yellow) 100%);
    color:var(--ink);
    border:none;border-radius:16px;
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:16px;
    padding:14px 18px;cursor:pointer;letter-spacing:.02em;
    box-shadow:0 10px 24px -10px rgba(245,169,38,0.55), inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .draw-btn:hover{transform:translateY(-2px);}
  .draw-btn:active{transform:translateY(0px) scale(.985);}
  .draw-btn.spin{animation:pulse .55s ease;}
  @keyframes pulse{0%{transform:scale(1);}50%{transform:scale(.94);}100%{transform:scale(1);}}

  footer{
    text-align:center;margin-top:22px;font-size:11px;color:var(--muted);
    font-family:'Nunito',sans-serif;font-weight:700;letter-spacing:.02em;
  }

  @media (max-width:420px){
    .tab{font-size:10px;padding:9px 3px;}
    .ticket-topic{font-size:18px;}
  }
  @media (prefers-reduced-motion: reduce){
    .ticket{animation:none;}
    .draw-btn.spin{animation:none;}
  }
</style>
</head>
<body>
<div class="wrap">
<div class="layout">

  <div class="left-col">
    <span class="spark-icon amb amb-1">✦</span>
    <span class="spark-icon amb amb-2">✦</span>
    <span class="spark-icon amb amb-3">✦</span>
    <span class="spark-icon amb amb-4">✦</span>
    <span class="spark-icon amb amb-5">✦</span>
    <span class="spark-icon amb amb-6">✦</span>
    <header>
      <h1>Talk <span class="spark-wrap"><em>Spark</em>
        <svg class="underline-svg" viewBox="0 0 180 16" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 10 Q 45 2, 90 8 T 176 6" stroke="var(--yellow-deep)" stroke-width="6" stroke-linecap="round" fill="none"/>
        </svg>
        <span class="spark-icon spark-icon-1">✨</span>
      </span></h1>
      <span class="spark-icon spark-icon-2">✦</span>
      <span class="spark-icon spark-icon-3">✦</span>
      <span class="spark-icon spark-icon-4">✦</span>
      <span class="spark-icon spark-icon-5">✦</span>
      <span class="spark-icon spark-icon-6">✦</span>
      <div class="sub-line"><span class="sub-num">1</span>Get a random topic.</div>
      <div class="sub-line"><span class="sub-num">2</span>Speak on the spot.</div>
    </header>
  </div>

  <div class="right-col">
    <div class="tabs">
      <div class="tab active" data-tab="social">Social</div>
      <div class="tab" data-tab="question">Casual</div>
      <div class="tab" data-tab="ielts">Cue card</div>
      <div class="tab" data-tab="roleplay">Role play</div>
      <div class="tab" data-tab="vocab">Vocab</div>
    </div>

    <div class="machine">
      <div class="machine-head">
        <div class="machine-title"><span class="dot">●</span><span id="machineTitle">Social topics</span></div>
      </div>
      <div class="tab-tip" id="tabTip"></div>

      <div class="stage">
        <div class="placeholder" id="placeholder">
          <span class="cap">✦ Ready when you are ✦</span>
          <span class="big">🎟️</span>
          Your ticket will appear here
        </div>
        <div class="ticket" id="ticket"></div>
      </div>

      <div class="draw-row">
        <button class="draw-btn" id="drawBtn">Pick</button>
        <div class="level-row" id="levelRow"></div>
        <button class="timer-btn" id="timerBtn" title="Start a 60s timer">⏱</button>
      </div>
    </div>
  </div>

</div>
</div>

<script>
/* ============ DATA: 70 SOCIAL TOPICS (VN + Global) ============ */
const SOCIAL = [
["Should Vietnam ban gambling advertisements?", "vn", "easy", "I think gambling ads should be restricted, especially where children might see them. They often promote unrealistic expectations about winning money. For example, some ads target young audiences through social media and games. That said, a complete ban might just push advertising underground. Overall, I think stricter limits make more sense than a total ban. This kind of debate tends to resurface whenever circumstances shift, so opinions here will probably keep evolving."],
["Is it fair to charge different prices based on nationality at tourist sites?", "vn", "inter", "I don't think it's entirely fair, even though I understand the reasoning. Higher prices for foreigners are often meant to fund maintenance using local subsidies. For example, many countries use resident discounts to keep sites accessible to citizens. On the other hand, this can feel discriminatory to visitors. Overall, I think transparent pricing policies would be a better solution. What ultimately determines the outcome is usually implementation, not the underlying idea itself."],
["Should companies allow employees to choose their own working hours?", "global", "inter", "Yes, I think flexible hours generally benefit both employees and companies. People are naturally more productive at different times of day. For example, some employees focus better early in the morning, while others work best at night. That said, coordination can become difficult without some shared hours. Overall, I think a flexible core-hours system works best. Public attitudes toward this seem to be gradually shifting as more real-world examples emerge."],
["Is Vietnam's education system placing too much value on English proficiency?", "vn", "inter", "I think it places significant value on English, though not necessarily too much. English opens up global opportunities for students. For example, many well-paying jobs now require strong English skills. On the other hand, this can disadvantage students in subjects like math or science. Overall, I think a more balanced curriculum would serve students better. How this plays out will likely depend heavily on local context rather than a single universal answer."],
["Should social media platforms limit how long users can scroll each day?", "global", "easy", "Yes, I think some kind of time limit would be helpful. Endless scrolling can easily eat up hours without anyone noticing. For example, many apps already show weekly screen-time reports. That said, enforcing strict limits could feel overly controlling to some users. Constant notifications also contribute to this addictive cycle. Overall, I think optional reminders are a reasonable middle ground. It's the kind of issue where good intentions alone rarely guarantee a smooth outcome."],
["Is it necessary for Vietnam to build more high-rise apartments in cities?", "vn", "inter", "I think it's necessary to some extent, given how limited urban land is. High-rises allow more people to live closer to job opportunities. For example, cities like Ho Chi Minh City are already expanding vertically. On the other hand, poorly planned high-rises can strain infrastructure like water and electricity. Overall, I think careful planning matters more than the buildings themselves. Ultimately, striking the right balance matters more than adopting an extreme position either way."],
["Should influencers be banned from promoting unhealthy food to children?", "both", "easy", "Yes, I think there should be clear restrictions on this. Children are especially influenced by people they admire online. For example, some influencers promote sugary snacks directly to young audiences. That said, a full ban might be hard to enforce consistently. Overall, I think stricter guidelines would help protect children without banning influencer marketing entirely. Whether this succeeds probably comes down to how thoughtfully it's rolled out over time."],
["Is it acceptable for parents to track their teenager's phone location?", "both", "inter", "I think it's acceptable within reason, especially for younger teenagers. Safety is a valid concern for many parents today. For example, knowing a teen's general location can help in emergencies. On the other hand, constant tracking can damage trust between parent and child. Overall, I think open communication matters more than the tracking itself. This is one of those topics where perspectives can shift considerably depending on someone's personal experience."],
["Should Vietnam introduce stricter noise regulations in residential areas?", "vn", "easy", "Yes, I think stricter noise rules would improve quality of life. Loud karaoke and construction noise are common complaints in many neighborhoods. For example, some areas already have quiet hours that aren't well enforced. That said, enforcement would require more resources from local authorities. Residents near busy karaoke venues often suffer the most from this. Overall, I think better enforcement matters just as much as new rules. As with most policy questions, the details of execution tend to matter as much as the principle behind it."],
["Is remote work widening the gap between office workers and factory workers?", "both", "inter", "I think it is, to some extent. Remote work benefits people whose jobs can be done on a computer. For example, factory and service workers rarely have that flexibility. On the other hand, this gap has always existed in different forms. Overall, I think it's becoming more visible rather than entirely new. I suspect attitudes toward this will keep changing as younger generations become more influential."],
["Should Vietnam preserve more of its old French colonial architecture?", "vn", "easy", "Yes, I think these buildings are an important part of Vietnam's history. They tell a story about the country's past that shouldn't be lost. For example, cities like Hanoi still have beautiful examples of this architecture. That said, preservation can be expensive and sometimes conflicts with development needs. These buildings also attract considerable heritage tourism revenue each year. Overall, I think a balance between preservation and growth is achievable. There's rarely a perfect solution here, just a series of reasonable trade-offs to weigh."],
["Is it healthy for companies to promote a \"hustle culture\"?", "global", "inter", "No, I don't think it's healthy in the long run. Constantly glorifying overwork often leads to burnout rather than better results. For example, employees under this kind of pressure often make more mistakes over time. That said, ambition and hard work aren't inherently bad things. Overall, I think sustainable effort produces better outcomes than constant hustle. This debate often reveals a deeper tension between short-term convenience and long-term wellbeing."],
["Should street lighting be improved in Vietnam's smaller towns?", "vn", "easy", "Yes, I think better lighting would improve both safety and daily life. Poorly lit streets can make walking at night feel unsafe. For example, many smaller towns still rely on very limited lighting. That said, this requires investment that some local budgets may not have. Overall, I think it's a worthwhile long-term investment. It's a reminder that good policy usually requires patience rather than sweeping, immediate change."],
["Is it ethical for companies to use customer data for targeted ads?", "global", "inter", "I think it depends heavily on how transparent companies are about it. Personalized ads can be genuinely useful when done responsibly. For example, I've discovered useful products through ads based on my interests. On the other hand, this becomes unethical when data is collected without clear consent. Overall, I think transparency is the key factor. How people feel about this often reflects broader anxieties about change happening too quickly."],
["Should Vietnam expand bike-sharing programs in major cities?", "vn", "easy", "Yes, I think bike-sharing programs would benefit both traffic and health. They offer a cheap, flexible alternative to motorbikes for short trips. For example, similar programs have worked well in other Asian cities. That said, safe bike lanes would need to be built first. Overall, I think it's a promising idea if paired with proper infrastructure. The strongest arguments here tend to come from people who've actually experienced both sides directly."],
["Is it becoming too easy to get a loan through mobile banking apps?", "both", "inter", "I think it's becoming a bit too easy for some users. Quick approval can lead people to borrow more than they can repay. For example, some apps offer loans within minutes with minimal checks. That said, easy access also helps people in genuine financial emergencies. Overall, I think better safeguards are needed rather than removing the convenience entirely. This is ultimately less about right and wrong, and more about weighing competing priorities fairly."],
["Should Vietnam invest more in disaster preparedness for floods and storms?", "vn", "easy", "Yes, I think this is an increasingly urgent priority. Extreme weather events seem to be happening more frequently in recent years. For example, central Vietnam regularly faces severe flooding during storm season. That said, this requires long-term funding and planning. Overall, I think prevention is far more cost-effective than dealing with the aftermath. Progress on this front tends to be gradual, shaped more by small adjustments than dramatic reform."],
["Is it important for schools to teach media literacy?", "global", "inter", "Yes, I think it's an essential modern skill. Students are exposed to huge amounts of information online every day. For example, many young people struggle to identify misleading news articles. That said, adding new subjects to an already full curriculum can be difficult. Overall, I think it's important enough to prioritize. What complicates this issue is that reasonable people can genuinely disagree based on differing values."],
["Should Vietnam limit motorbike ownership per household?", "vn", "inter", "I don't think a strict limit is realistic, given how essential motorbikes are for daily life. Many families rely on them for work and school commutes. For example, public transport still doesn't reach every area conveniently. That said, incentives for public transport could reduce the need for multiple bikes. Overall, I think better alternatives matter more than direct limits. I imagine this will remain a talking point for years, since the underlying tension isn't easily resolved."],
["Is it acceptable for restaurants to charge for tap water?", "global", "easy", "I don't think it's entirely acceptable, though I understand the business reasoning. Water is often seen as a basic expectation when dining out. For example, many countries provide free water as standard practice. That said, restaurants do have real costs to cover. Many diners would simply appreciate more transparency about such policies. Overall, I think a small, clearly stated charge is a fair compromise. This really highlights how personal circumstances can shape what feels like common sense to different people."],
["Should Vietnam do more to protect its coral reefs and marine life?", "vn", "easy", "Yes, I think stronger protection is necessary. Coral reefs support both tourism and local fishing industries. For example, popular diving spots have already shown signs of damage from overuse. That said, protection efforts need to balance conservation with local livelihoods. Overall, I think sustainable tourism practices could help protect these ecosystems. A lot depends on whether the people affected are genuinely consulted before changes take effect."],
["Is it a good idea for cities to introduce car-free days?", "both", "easy", "Yes, I think car-free days are a great initiative. They reduce pollution and encourage people to explore cities differently. For example, some cities have seen a noticeable drop in noise and air pollution on these days. That said, it can be inconvenient for people who depend on cars for work. Overall, I think occasional car-free days offer more benefits than drawbacks. This issue tends to divide opinion along generational lines more than almost anything else."],
["Should Vietnam raise awareness about food waste in restaurants?", "vn", "easy", "Yes, I think this is an important issue to address. A significant amount of food is wasted at buffets and large gatherings. For example, some restaurants have started offering smaller portion options to reduce waste. That said, changing habits takes time and consistent effort. Overall, I think awareness campaigns are a good starting point. Whatever direction this takes, transparency throughout the process will likely matter as much as the decision itself."],
["Is it fair for schools to rank students publicly by test scores?", "both", "inter", "I don't think it's entirely fair to most students. Public ranking can create unnecessary pressure and anxiety. For example, students who don't rank highly may lose motivation altogether. That said, some students find rankings motivating rather than discouraging. Overall, I think private feedback would be a healthier approach for most students. It's easy to have strong opinions on this in theory, but much harder once real trade-offs are involved."],
["Should Vietnam invest in more community libraries?", "vn", "easy", "Yes, I think community libraries provide real value beyond just books. They offer free, quiet spaces for studying and community events. For example, some neighborhoods currently have very limited access to libraries. That said, funding and staffing would need to be carefully planned. Overall, I think it's a worthwhile investment in education and community life. This reflects a broader pattern where convenience and responsibility often pull in opposite directions."],
["Is it a problem that many young people rely on credit for everyday spending?", "global", "inter", "Yes, I think it's becoming a genuine concern. Relying on credit for daily expenses can quickly lead to debt. For example, buy-now-pay-later services have made overspending easier than ever. That said, credit can also be a useful tool when managed responsibly. Overall, I think better financial education is the real solution here. This kind of debate tends to resurface whenever circumstances shift, so opinions here will probably keep evolving."],
["Should Vietnam do more to support local farmers over imported produce?", "vn", "easy", "Yes, I think supporting local farmers benefits both the economy and food quality. Locally grown produce is often fresher and requires less transportation. For example, farmers' markets have become more popular in recent years. That said, imported produce sometimes offers variety that isn't grown locally. Overall, I think a healthy balance between both is ideal. What ultimately determines the outcome is usually implementation, not the underlying idea itself."],
["Is it necessary to regulate how AI chatbots are used in customer service?", "global", "inter", "Yes, I think some regulation is necessary as AI use grows. Customers should know when they're speaking with a chatbot rather than a person. For example, some companies now clearly label AI-assisted conversations. That said, overregulation could slow down genuinely helpful innovation. Overall, I think transparency requirements are a reasonable starting point. Public attitudes toward this seem to be gradually shifting as more real-world examples emerge."],
["Should Vietnam introduce more pedestrian-only streets in city centers?", "vn", "easy", "Yes, I think pedestrian-only streets would improve city life significantly. They create safer, more pleasant spaces for walking and socializing. For example, similar streets in other cities have boosted local businesses. That said, this requires careful planning around traffic flow nearby. Overall, I think the benefits would outweigh the initial inconvenience. How this plays out will likely depend heavily on local context rather than a single universal answer."],
["Is it healthy for teenagers to have part-time jobs while studying?", "both", "inter", "I think it can be healthy in moderation. Part-time work teaches responsibility and basic financial skills early on. For example, many students learn valuable time-management skills through balancing work and school. That said, too many hours can negatively affect academic performance. Overall, I think a limited number of hours is the healthiest approach. It's the kind of issue where good intentions alone rarely guarantee a smooth outcome."],
["Should Vietnam invest more in renewable energy like solar and wind?", "vn", "inter", "Yes, I strongly think this is necessary for the future. Vietnam has excellent natural conditions for both solar and wind energy. For example, coastal and central regions already show strong renewable energy potential. That said, the upfront investment costs are still a significant challenge. Overall, I think the long-term benefits clearly outweigh the initial costs. Ultimately, striking the right balance matters more than adopting an extreme position either way."],
["Is it fair for landlords to require large deposits from tenants?", "both", "easy", "I think it depends on how large the deposit actually is. Landlords do need some protection against potential property damage. For example, a deposit equal to one or two months' rent seems reasonable. That said, excessively large deposits can be a real burden for tenants. Overall, I think deposits should be proportional and clearly justified. Whether this succeeds probably comes down to how thoughtfully it's rolled out over time."],
["Should Vietnam do more to preserve its traditional handicraft villages?", "vn", "easy", "Yes, I think these villages represent valuable cultural heritage. Many traditional crafts risk disappearing as younger generations move to cities. For example, some villages have already lost skilled artisans to more modern jobs. That said, preservation efforts need to make these crafts economically sustainable too. Overall, I think supporting tourism around these villages could help preserve them. This is one of those topics where perspectives can shift considerably depending on someone's personal experience."],
["Is it a good idea to introduce a four-day school week nationwide?", "global", "inter", "I think it could work well if implemented thoughtfully. A shorter week could reduce student stress and improve focus. For example, some schools that have trialed it report better student wellbeing. That said, working parents might struggle with additional childcare needs. Overall, I think it's worth testing more widely before a full rollout. As with most policy questions, the details of execution tend to matter as much as the principle behind it."],
["Should Vietnam make public restrooms more accessible in cities?", "vn", "easy", "Yes, I think this is a simple but important improvement. Many visitors and residents struggle to find clean public restrooms. For example, this is a common complaint among tourists exploring city centers. That said, maintaining these facilities requires ongoing funding and staff. Overall, I think the benefit to daily convenience makes it worthwhile. I suspect attitudes toward this will keep changing as younger generations become more influential."],
["Is it a problem that so much packaging is used for online orders?", "global", "easy", "Yes, I think excessive packaging has become a real environmental concern. A single small item is often wrapped in several unnecessary layers. For example, many online orders arrive in boxes far larger than needed. That said, some packaging is necessary to prevent items from being damaged. Overall, I think companies could reduce waste without compromising protection. There's rarely a perfect solution here, just a series of reasonable trade-offs to weigh."],
["Should Vietnam invest more in flood-resistant infrastructure?", "vn", "inter", "Yes, I think this is becoming an urgent necessity. Many low-lying areas already experience regular flooding during heavy rain. For example, parts of Ho Chi Minh City flood after just a short downpour. That said, this kind of infrastructure requires significant long-term investment. Overall, I think the cost of inaction would be far higher. This debate often reveals a deeper tension between short-term convenience and long-term wellbeing."],
["Is it acceptable for companies to require employees to be reachable 24/7?", "global", "inter", "No, I don't think this is acceptable in most cases. Constant availability can seriously affect employees' mental health and personal life. For example, studies have linked this expectation to higher rates of burnout. That said, some roles genuinely require occasional after-hours availability. Overall, I think clear boundaries should be the default, not the exception. It's a reminder that good policy usually requires patience rather than sweeping, immediate change."],
["Should Vietnam do more to support small local bookstores?", "vn", "easy", "Yes, I think small bookstores offer something larger retailers can't. They often provide a more personal, community-focused experience. For example, many independent bookstores host local events and reading clubs. That said, competing with online prices remains a real challenge for them. Overall, I think community support can help these stores survive. How people feel about this often reflects broader anxieties about change happening too quickly."],
["Is it becoming harder to disconnect from work due to messaging apps?", "both", "inter", "Yes, I think it's becoming increasingly difficult. Work messages now arrive on the same apps used for personal chats. For example, many people check work messages out of habit, even late at night. That said, some companies are introducing policies to limit after-hours messaging. Overall, I think clearer boundaries would help employees truly disconnect. The strongest arguments here tend to come from people who've actually experienced both sides directly."],
["Should Vietnam introduce a returnable bottle deposit system?", "vn", "easy", "Yes, I think this could meaningfully reduce plastic waste. A small deposit encourages people to return bottles instead of throwing them away. For example, similar systems have worked well in several other countries. That said, setting up the collection infrastructure would take time and investment. Overall, I think the environmental benefits make it worth pursuing. This is ultimately less about right and wrong, and more about weighing competing priorities fairly."],
["Is it fair for airlines to charge extra for carry-on luggage?", "global", "easy", "I think it's fair as long as the pricing is clear upfront. Airlines need to manage limited cabin space efficiently. For example, budget airlines often offer lower base fares in exchange for these extra fees. That said, hidden or unclear fees can feel unfair to passengers. Overall, I think transparency is what really matters here. Progress on this front tends to be gradual, shaped more by small adjustments than dramatic reform."],
["Should Vietnam invest more in rural internet access?", "vn", "inter", "Yes, I think this is essential for reducing inequality between regions. Reliable internet access opens up education and job opportunities. For example, students in rural areas often struggle with online learning due to poor connectivity. That said, expanding infrastructure to remote areas can be costly. Overall, I think the long-term benefits justify the investment. What complicates this issue is that reasonable people can genuinely disagree based on differing values."],
["Is it healthy for schools to give students so much homework?", "both", "inter", "I don't think excessive homework is healthy for most students. Too much homework can reduce time for rest, family, and hobbies. For example, some students report feeling constantly stressed due to nightly workloads. That said, a reasonable amount of homework does reinforce learning. Overall, I think quality matters more than quantity when it comes to homework. I imagine this will remain a talking point for years, since the underlying tension isn't easily resolved."],
["Should Vietnam do more to support women returning to work after having children?", "vn", "inter", "Yes, I think stronger support is definitely needed. Many women face real challenges balancing childcare and career after maternity leave. For example, affordable childcare options remain limited in many cities. That said, this requires both government policy and support from employers. Overall, I think this support benefits families and the economy alike. This really highlights how personal circumstances can shape what feels like common sense to different people."],
["Is it a good idea for offices to remove assigned desks entirely?", "global", "inter", "I think it depends on the type of work being done. Flexible seating can encourage collaboration and save office space. For example, some companies have successfully adopted this for teams that don't need fixed setups. That said, some employees value having a consistent, personal workspace. Overall, I think offering a choice works better than removing desks entirely. A lot depends on whether the people affected are genuinely consulted before changes take effect."],
["Should Vietnam expand its national park system?", "vn", "easy", "Yes, I think expanding protected natural areas is important. National parks help preserve biodiversity and offer spaces for outdoor recreation. For example, existing parks like Cat Tien already attract both tourists and researchers. That said, expansion needs careful planning to avoid conflicts with local communities. Overall, I think the environmental benefits make this a worthwhile priority. This issue tends to divide opinion along generational lines more than almost anything else."],
["Is it acceptable for social media influencers to edit their photos heavily?", "global", "easy", "I think it's acceptable as long as it's not misleading in harmful ways. Some editing is a normal part of creative content. For example, many influencers use filters simply for artistic style. That said, heavily edited images can create unrealistic beauty standards. Younger audiences can be particularly vulnerable to these unrealistic standards. Overall, I think honesty about editing would make this more acceptable. Whatever direction this takes, transparency throughout the process will likely matter as much as the decision itself."],
["Should Vietnam invest more in vocational apprenticeship programs?", "vn", "inter", "Yes, I think apprenticeship programs offer real practical value. They give students hands-on experience alongside theoretical learning. For example, countries with strong apprenticeship systems often report lower youth unemployment. That said, these programs need strong partnerships between schools and businesses. Overall, I think this investment would benefit both students and industries. It's easy to have strong opinions on this in theory, but much harder once real trade-offs are involved."],
["Is it becoming too normal to eat meals in front of a screen?", "both", "easy", "Yes, I think it's become extremely common, especially among younger people. Eating in front of a screen often leads to mindless overeating. For example, I've noticed I eat much faster when distracted by my phone. That said, occasional screen time during meals isn't necessarily harmful. Overall, I think mindful eating habits are worth practicing more often. This reflects a broader pattern where convenience and responsibility often pull in opposite directions."],
["Should motorbikes be banned from Vietnam's city centers by 2030?", "vn", "easy", "I think a full ban would be too sudden. A gradual reduction, combined with better public transport, would be more realistic and fair to daily commuters. For example, Ho Chi Minh City could start with car-free weekends downtown before expanding the policy further. Of course, some argue that public transport isn't ready yet to handle the shift, which is a fair concern. Overall, I think a phased approach balances environmental goals with people's daily needs. This kind of debate tends to resurface whenever circumstances shift, so opinions here will probably keep evolving."],
["Is social media doing more harm than good to teenagers?", "global", "easy", "I'd say it does more harm overall. It fuels comparison and anxiety, though it also helps teens stay connected with friends. For example, teenagers who spend hours scrolling often report feeling worse about their own lives afterward. On the other hand, it does offer real benefits, like helping people maintain long-distance friendships more easily. Overall, I'd say the harm outweighs the benefits for this age group specifically. What ultimately determines the outcome is usually implementation, not the underlying idea itself."],
["Should Vietnam raise the retirement age?", "vn", "easy", "Yes, gradually. Life expectancy is rising, and a slightly higher retirement age would ease pressure on the pension system. Countries like Japan have already raised theirs successfully, so Vietnam could follow a similar gradual timeline. That said, physically demanding jobs might need exceptions, since not every worker can realistically continue at the same pace. Overall, a flexible, industry-specific approach seems fairest. Public attitudes toward this seem to be gradually shifting as more real-world examples emerge."],
["Is a four-day work week realistic for Vietnamese companies?", "both", "easy", "Not yet for most industries. It could work for office jobs, but manufacturing and service sectors still rely heavily on six-day schedules. It would need clear planning, since cutting a day without reducing workload just creates more pressure on the remaining days. On the other hand, some companies that have trialed it report higher morale and similar productivity. Overall, I think it's worth piloting in office-based industries first before wider rollout. How this plays out will likely depend heavily on local context rather than a single universal answer."],
["Should university entrance exams be replaced with a different system?", "vn", "easy", "I think exams should be combined with other factors like portfolios, since one test doesn't capture a student's full potential. That way, students with strong practical skills but average test scores wouldn't be overlooked. Of course, a purely portfolio-based system could be harder to standardize fairly. Overall, a blended approach still seems like the most balanced solution. It's the kind of issue where good intentions alone rarely guarantee a smooth outcome."],
["Is remote work better than working in an office?", "global", "easy", "It depends on the job. Remote work offers flexibility, but office work makes collaboration and mentoring easier for younger employees. In my experience, hybrid models that combine both usually work best for most teams. That said, remote work can blur boundaries between personal and professional life if not managed carefully. Overall, I think the right balance really depends on the individual and the role. Ultimately, striking the right balance matters more than adopting an extreme position either way."],
["Should livestream selling be regulated more strictly?", "vn", "inter", "Yes, especially around product quality claims. Many livestream sellers exaggerate benefits, and buyers have little protection if something goes wrong. Without regulation, buyers often can't tell fake products from genuine ones until it's too late. On the other hand, overregulation could slow down small sellers who rely on livestreaming for income. Overall, I think reasonable rules focused on transparency would strike the right balance. Whether this succeeds probably comes down to how thoughtfully it's rolled out over time."],
["Is fast fashion an environmental disaster?", "global", "easy", "Largely yes. Cheap, disposable clothing creates huge textile waste, and most of it ends up in landfills within a year. Brands that focus on quality over quantity would help shift the industry toward more sustainable habits. That said, it does make trendy clothing affordable for people with lower incomes. Overall, I think the environmental cost is too high to ignore. This is one of those topics where perspectives can shift considerably depending on someone's personal experience."],
["Should Ha Long Bay limit the number of tourists per day?", "vn", "easy", "I think so. Overcrowding damages the natural environment, and a daily cap would help preserve it for future visitors. Other UNESCO sites have used similar caps successfully without hurting tourism revenue. Of course, a cap could reduce income for local businesses in the short term. Overall, I think long-term preservation is worth that temporary trade-off. As with most policy questions, the details of execution tend to matter as much as the principle behind it."],
["Is AI going to replace more jobs than it creates?", "global", "inter", "In the short term, yes, especially repetitive roles. But historically, new technology also creates jobs we can't yet imagine. That's why reskilling programs will probably matter more than trying to stop automation itself. That said, roles requiring empathy or creativity will likely remain safer from automation for a while. Overall, I think adaptation, not resistance, is the more realistic response. I suspect attitudes toward this will keep changing as younger generations become more influential."],
["Should Vietnam introduce a plastic bag tax nationwide?", "vn", "easy", "Yes, it's worked well in other countries. A small tax encourages people to switch to reusable bags fairly quickly. Within a year, most shoppers usually adjust and bring their own bags out of habit. On the other hand, it could be an extra cost for lower-income households at first. Overall, I think the environmental benefit justifies the small inconvenience. There's rarely a perfect solution here, just a series of reasonable trade-offs to weigh."],
["Is it fair that top students get pressured into 'elite' high schools?", "vn", "easy", "Not entirely. The pressure often comes more from parents' expectations than from the students' own goals or interests. Schools could help by openly discussing the risks of academic burnout with both students and parents. That said, some students do thrive under that kind of challenge and competition. Overall, I think the pressure becomes harmful only when it overrides a student's wellbeing. This debate often reveals a deeper tension between short-term convenience and long-term wellbeing."],
["Should children under 16 be banned from social media?", "global", "easy", "I lean toward yes, or at least stricter age verification, since younger children aren't ready for the pressures social media brings. Enforcing this would be difficult in practice, though, since many platforms don't verify age at all currently. Of course, some argue this limits kids' ability to learn digital literacy early. Overall, I think protecting mental health should come first at that age. It's a reminder that good policy usually requires patience rather than sweeping, immediate change."],
["Is arranged marriage still relevant in modern Vietnam?", "vn", "easy", "It's becoming less common, especially in cities, as more young people prefer to choose their own partners. Even in rural areas, family involvement has shifted from deciding partners to simply offering guidance. That said, some families still value the guidance and compatibility checks arranged marriages offer. Overall, I think it's shifting but hasn't disappeared completely. How people feel about this often reflects broader anxieties about change happening too quickly."],
["Should cash be phased out completely in favor of e-wallets?", "both", "inter", "Not completely — older generations and rural areas still rely heavily on cash, so a full switch would be premature. A slower, region-by-region transition would give everyone time to adapt at their own pace. On the other hand, e-wallets offer convenience and better spending tracking for most users. Reliable transactions also depend on stable internet access nationwide. Overall, I think a gradual, inclusive transition makes more sense than a sudden switch. The strongest arguments here tend to come from people who've actually experienced both sides directly."],
["Is overtourism ruining places like Sa Pa and Hoi An?", "vn", "easy", "To some extent, yes. Rapid tourism growth has strained infrastructure and changed the character of these once-quiet towns. Local authorities could introduce visitor caps similar to what some European destinations have done. That said, tourism also brings essential income to these local communities. Overall, I think better management is needed more than reduced tourism itself. This is ultimately less about right and wrong, and more about weighing competing priorities fairly."],
["Should companies be allowed to track employees' screen time?", "global", "inter", "I think it's acceptable within limits, but constant monitoring can feel invasive and lower trust between staff and management. Employees are usually more productive when they feel trusted rather than watched. On the other hand, some monitoring can help identify genuine productivity issues fairly. Overall, I think transparency about what's tracked matters more than the tracking itself. Progress on this front tends to be gradual, shaped more by small adjustments than dramatic reform."],
["Is the 'lucky money' (lì xì) tradition losing its meaning?", "vn", "easy", "A little, since the amount given now sometimes matters more than the symbolic wish for luck behind the tradition. Younger generations sometimes treat it more like a competition than a cultural gesture. That said, many families still keep the tradition meaningful by focusing on the wishes, not the amount. Overall, I think its value depends on how it's practiced within each family. What complicates this issue is that reasonable people can genuinely disagree based on differing values."],
["Should countries adopt a universal basic income?", "global", "inter", "It's worth testing through pilot programs first, since the cost and effect on motivation to work aren't fully clear yet. Finland's UBI trial showed some promising results for mental wellbeing, which is worth studying further. On the other hand, critics worry it could reduce motivation to work for some recipients. Overall, I think more real-world trials are needed before drawing firm conclusions. I imagine this will remain a talking point for years, since the underlying tension isn't easily resolved."],
["Is Vietnam's traffic problem solvable without a metro system?", "vn", "easy", "I don't think so. Without efficient public transport like a metro, traffic congestion will likely keep getting worse. Ho Chi Minh City's new metro line is a good first step, but the network needs to expand much further. That said, better bus networks and stricter traffic rules could help in the meantime. Overall, I think a metro system is still the long-term solution Vietnam needs. This really highlights how personal circumstances can shape what feels like common sense to different people."],
["Should influencers be legally responsible for the products they promote?", "both", "inter", "Yes, if they're paid to promote something, they should be accountable for misleading claims, just like traditional advertisers. This would also encourage them to research products more carefully before agreeing to promote them. On the other hand, it could be difficult to enforce fairly across every platform and country. Overall, I think basic accountability standards are a reasonable start. A lot depends on whether the people affected are genuinely consulted before changes take effect."],
["Is it healthy for students to have extra classes every evening?", "vn", "easy", "Not really. Constant extra classes leave little time for rest or hobbies, which can affect both health and motivation. Parents often push for it out of fear their child will fall behind, even when it isn't necessary. That said, some students genuinely benefit from the extra support if they're struggling. Overall, I think balance and rest should still be prioritized over constant study. This issue tends to divide opinion along generational lines more than almost anything else."],
["Should the voting age be lowered to 16?", "global", "easy", "I'm not convinced yet. Sixteen-year-olds may not have enough life experience to make fully informed political decisions. That said, some countries have seen positive engagement after lowering the voting age, so more research would help. On the other hand, many 16-year-olds today are more informed than previous generations thanks to easy access to information. Overall, I think it's a reasonable idea worth testing carefully. Whatever direction this takes, transparency throughout the process will likely matter as much as the decision itself."],
["Is countryside-to-city migration hurting Vietnam's rural areas?", "vn", "easy", "In some ways, yes — many rural areas are left with fewer young workers to support agriculture and local businesses. Better job opportunities and infrastructure in smaller towns could help slow this trend over time. That said, migration also gives individuals better income and opportunities they wouldn't have at home. Overall, I think rural development is key to keeping this balance healthy. It's easy to have strong opinions on this in theory, but much harder once real trade-offs are involved."],
["Should employers be banned from asking candidates' salary history?", "global", "inter", "Yes, it would help reduce pay gaps, since past salary shouldn't determine what someone deserves in a new role. Instead, salary should be based on the value of the role and the candidate's skills. On the other hand, some employers argue it helps them gauge a candidate's expectations quickly. Overall, I think fairness in pay should outweigh that convenience. This reflects a broader pattern where convenience and responsibility often pull in opposite directions."],
["Is Western/K-pop culture replacing traditional music among Vietnamese youth?", "vn", "easy", "To a large extent, yes. Most young people I know listen to K-pop or Western music far more than traditional genres. Streaming platforms have made it incredibly easy to discover international music instantly, which speeds up this shift. That said, some young people still appreciate traditional music, especially during festivals. Overall, I think both can coexist if traditional culture is actively promoted. This kind of debate tends to resurface whenever circumstances shift, so opinions here will probably keep evolving."],
["Should zoos be banned in favor of wildlife sanctuaries?", "global", "easy", "I think sanctuaries are generally better for animal welfare, though zoos still play a role in education and conservation funding. Sanctuaries usually offer more natural space, though good zoos can still fund important conservation research. On the other hand, zoos can make wildlife conservation more visible and relatable to the public. Overall, I think sanctuaries should be prioritized where possible. What ultimately determines the outcome is usually implementation, not the underlying idea itself."],
["Is Vietnam's street food culture at risk from modernization?", "vn", "easy", "A little, as rising rents push some vendors out, but street food remains deeply embedded in daily life here. Local governments could help by offering affordable designated food stalls to protect these small vendors. That said, some vendors have successfully adapted by modernizing their stalls while keeping traditional recipes. Overall, I think support from local authorities could help preserve this culture. Public attitudes toward this seem to be gradually shifting as more real-world examples emerge."],
["Should social media platforms verify users' real identities?", "global", "inter", "Partial verification could help reduce fake accounts and scams, though full identity disclosure raises privacy concerns. A middle ground, like verifying age without exposing full identity, might work best. On the other hand, mandatory identity checks could discourage people who value online anonymity for safety reasons. Overall, I think a balanced approach is needed to protect both safety and privacy. How this plays out will likely depend heavily on local context rather than a single universal answer."],
["Is the 'face' (sĩ diện) culture holding Vietnamese society back?", "vn", "easy", "In some situations, yes — it can discourage people from admitting mistakes or asking for help when they need it. Encouraging more open conversations about failure, especially in schools, could gradually shift this mindset. That said, valuing reputation isn't inherently bad when it encourages responsibility. Overall, I think it becomes a problem only when it prevents honesty. It's the kind of issue where good intentions alone rarely guarantee a smooth outcome."],
["Should tipping become a standard practice in Vietnamese restaurants?", "vn", "easy", "I don't think it needs to become mandatory, since service charges already cover this in many restaurants. That said, small optional tips are still appreciated for exceptional service. On the other hand, tipping could help reward exceptional service more directly. Fair wages for staff should really remain the bigger priority here. Overall, I think it works better as optional rather than expected. Ultimately, striking the right balance matters more than adopting an extreme position either way."],
["Is climate change the biggest threat facing our generation?", "global", "inter", "I'd say it's one of the biggest, alongside things like inequality, but its effects touch nearly every other issue. Its impact on food security and migration will likely make it a defining issue for decades to come. That said, other issues like global inequality are just as urgent in different ways. Reducing emissions and investing in renewable sources remains genuinely essential. Overall, I think climate change is unique because it worsens almost every other problem. Whether this succeeds probably comes down to how thoughtfully it's rolled out over time."],
["Should schools ban smartphones during class?", "both", "easy", "Yes, during lessons at least. Phones are a major distraction, even when students intend to use them responsibly. Some schools allow phones only during breaks, which seems like a reasonable compromise. On the other hand, phones can be useful for research or emergencies during school hours. Overall, I think limiting use to specific times is more practical than a full ban. This is one of those topics where perspectives can shift considerably depending on someone's personal experience."],
["Is Vietnam ready for a fully cashless economy?", "vn", "inter", "Not fully yet. Cities are close, but rural areas still lack the infrastructure and habits for cashless payments. Improving mobile banking access in rural provinces would be an important next step. That said, some people, especially the elderly, may find a fully digital system difficult to adapt to. Overall, I think a mixed system will likely remain necessary for a while. As with most policy questions, the details of execution tend to matter as much as the principle behind it."],
["Should billionaires be taxed more heavily?", "global", "inter", "I think a higher tax rate makes sense, since it could fund public services without significantly affecting their lifestyle. Of course, tax policy would need to avoid discouraging genuine investment and job creation. On the other hand, excessive taxation might discourage investment or push wealth elsewhere. Overall, I think a fair, carefully designed tax rate could still work well. I suspect attitudes toward this will keep changing as younger generations become more influential."],
["Is co-living becoming more common among young Vietnamese professionals?", "vn", "easy", "Yes, especially in big cities, since it's a practical way to split high rent costs with other young workers. It also creates a built-in social network for people new to a city. That said, it can be challenging when people have very different lifestyles or habits. Overall, I think it works well when housemates set clear expectations early. There's rarely a perfect solution here, just a series of reasonable trade-offs to weigh."],
["Should countries open their borders to more immigration?", "global", "inter", "It depends on the country's needs, but generally, controlled immigration can fill labor gaps and boost the economy. Countries with aging populations, in particular, often benefit from a steady flow of working-age immigrants. On the other hand, rapid immigration without proper planning could strain public services. Overall, I think a well-managed, gradual approach benefits both immigrants and host countries. This debate often reveals a deeper tension between short-term convenience and long-term wellbeing."],
["Is the pressure to buy a house before marriage unrealistic in Vietnam today?", "vn", "easy", "Yes, given how much property prices have risen compared to average incomes, especially in major cities. This has led many young couples to delay marriage or rely heavily on family financial support. That said, some couples choose to rent and prioritize experiences instead. Overall, I think social expectations here need to catch up with today's economic reality. It's a reminder that good policy usually requires patience rather than sweeping, immediate change."],
["Should reality TV shows be considered harmful entertainment?", "global", "easy", "Some are, especially ones that encourage conflict for entertainment, but not all reality shows have a negative effect. Shows focused on skills or talent tend to have a much more positive influence than pure drama-driven ones. On the other hand, some shows do highlight real talent and hard work. Controversial editing choices can also distort how audiences perceive contestants. Overall, I think it depends heavily on the specific show and its focus. How people feel about this often reflects broader anxieties about change happening too quickly."],
["Is Vietnam's aging population going to strain its healthcare system?", "vn", "inter", "Likely yes, unless investment in healthcare and elderly care services increases significantly over the next decade. Expanding community health clinics could help ease pressure on hospitals as the population ages. That said, technology like telemedicine could help ease some of this pressure. Overall, I think early investment now would prevent bigger problems later. The strongest arguments here tend to come from people who've actually experienced both sides directly."],
["Should companies be required to offer mental health days?", "global", "easy", "Yes, mental health affects productivity just as much as physical health, so it deserves the same kind of support. Some companies already offer this and report noticeably lower burnout rates among staff. On the other hand, some worry it could be misused if not properly monitored. Overall, I think the long-term benefits to employee wellbeing outweigh that risk. This is ultimately less about right and wrong, and more about weighing competing priorities fairly."],
["Is online dating changing how young Vietnamese people find partners?", "vn", "easy", "Definitely. It's become one of the most common ways for young people in cities to meet potential partners now. It's also made dating more accessible for people with smaller social circles or busy schedules. That said, some people still prefer meeting partners through mutual friends or shared activities. Overall, I think both methods will likely continue to coexist. Progress on this front tends to be gradual, shaped more by small adjustments than dramatic reform."],
["Should video games be recognized as a legitimate sport (esports)?", "both", "easy", "Yes, esports requires just as much skill, practice, and strategy as many traditional sports. Major esports tournaments now offer prize money that rivals many traditional sporting events. On the other hand, some traditionalists argue it lacks the physical demands of conventional sports. Professional athletes in this competitive scene train just as rigorously. Overall, I think skill and competition, not physical exertion alone, should define a sport. What complicates this issue is that reasonable people can genuinely disagree based on differing values."],
["Is Vietnam's education system too focused on memorization?", "vn", "easy", "To some extent, yes, though there's been a gradual shift toward more critical thinking in recent curriculum updates. Encouraging more project-based learning could help balance memorization with practical understanding. That said, memorization does help build a foundational knowledge base in early education. Overall, I think a better balance with critical thinking is still needed. I imagine this will remain a talking point for years, since the underlying tension isn't easily resolved."],
["Should governments regulate cryptocurrency more strictly?", "global", "inter", "Yes, mainly to protect ordinary investors from scams, since the market is still largely unregulated in many countries. Clear rules would also make it easier for legitimate crypto businesses to operate with confidence. On the other hand, excessive regulation could push innovation and investment elsewhere. Overall, I think smart, balanced regulation protects people without stifling growth. This really highlights how personal circumstances can shape what feels like common sense to different people."],
["Is the gig economy (Grab, Baemin) good for workers in the long run?", "both", "inter", "It offers flexibility, but without benefits like insurance, it can be risky for workers relying on it long-term. Offering optional benefits packages could help close this gap without removing the flexibility workers value. That said, the flexibility it offers is genuinely valuable for people balancing multiple responsibilities. Overall, I think it works best as a supplement, not a sole source of income. A lot depends on whether the people affected are genuinely consulted before changes take effect."],
["Should public smoking be banned in all outdoor spaces?", "both", "easy", "Not entirely, but designated smoking areas away from crowds would help balance smokers' rights with public health. This approach has worked reasonably well in cities that already use it. On the other hand, some argue open outdoor spaces naturally disperse smoke, reducing harm. Overall, I think a middle ground with designated areas makes the most sense. This issue tends to divide opinion along generational lines more than almost anything else."],
["Is single-child family pressure changing family values in Vietnam?", "vn", "easy", "Somewhat, since only children often receive more attention and resources, which can shift family dynamics and expectations. It can also increase pressure on that one child to meet high expectations from the whole family. That said, only children often develop strong independence and close parental bonds. Overall, I think the impact really depends on how the family manages expectations. Whatever direction this takes, transparency throughout the process will likely matter as much as the decision itself."],
["Should space tourism be limited to protect the environment?", "global", "inter", "Yes, given how much fuel and emissions each launch produces, it should be limited until it's more sustainable. As the technology matures, stricter environmental standards could be introduced without stopping innovation entirely. On the other hand, space tourism could drive valuable advances in aerospace technology. Overall, I think progress and environmental responsibility need to move forward together. It's easy to have strong opinions on this in theory, but much harder once real trade-offs are involved."],
["Is Vietnam losing its heritage architecture to modern development?", "vn", "easy", "In many cities, yes — older buildings are frequently replaced instead of restored, especially in prime commercial areas. Stronger preservation incentives for property owners could help balance heritage protection with development needs. That said, modern development does bring necessary housing and infrastructure improvements. Overall, I think cities need to find creative ways to preserve heritage while still growing. This reflects a broader pattern where convenience and responsibility often pull in opposite directions."],
["Should employees have the right to disconnect after work hours?", "global", "inter", "Yes, constantly being available after hours leads to burnout, and it should be a protected right, not just a request. Some countries have already passed laws protecting this right, and productivity hasn't suffered as a result. On the other hand, some industries genuinely require flexibility outside standard hours. Overall, I think clear boundaries benefit both employees and long-term company performance. This kind of debate tends to resurface whenever circumstances shift, so opinions here will probably keep evolving."],
["Is the 'học thêm' (extra tutoring) culture necessary or excessive?", "vn", "easy", "I think it's become excessive, since many students attend far more tutoring than needed just to keep up with peers. Schools could help by reassuring parents that quality of study time matters more than quantity. That said, tutoring can genuinely help students who are falling behind catch up. Overall, I think it becomes excessive only when it replaces rest and personal time entirely. What ultimately determines the outcome is usually implementation, not the underlying idea itself."],
["Should countries ban single-use plastics entirely?", "global", "easy", "A full ban may be difficult immediately, but a phased approach starting with the most wasteful items makes sense. Starting with plastic straws and bags, like several countries have already done, makes the transition easier. On the other hand, alternatives aren't always as affordable or accessible yet. Excessive packaging and pollution remain the biggest underlying concerns. Overall, I think a gradual ban paired with better alternatives is the most realistic path. Public attitudes toward this seem to be gradually shifting as more real-world examples emerge."],
["Is Vietnam's night economy (bar streets, night markets) good for cities?", "vn", "easy", "Yes, it boosts tourism and local business, as long as noise and safety are properly managed. Better lighting and more visible security could help address safety concerns without hurting the atmosphere. That said, some residents living nearby understandably worry about late-night disturbances. Overall, I think good planning can let both nightlife and residents coexist. How this plays out will likely depend heavily on local context rather than a single universal answer."],
["Should social media influencers pay taxes on gifted products?", "both", "inter", "Yes, gifted products are still a form of income or compensation, so they should be treated the same way. This is already standard practice in several other countries with strong influencer marketing industries. On the other hand, tracking and valuing gifted items fairly can be logistically tricky. Overall, I think clear guidelines would make this easier to enforce fairly. It's the kind of issue where good intentions alone rarely guarantee a smooth outcome."],
["Is working from a coffee shop more productive than an office?", "vn", "easy", "For some people yes, since a change of environment helps focus, but others find cafes too noisy to concentrate. Noise-canceling headphones seem to be the compromise most people rely on either way. That said, home offices can offer quieter, more controlled environments for deep work. Overall, I think it really comes down to personal work style. Ultimately, striking the right balance matters more than adopting an extreme position either way."],
["Should AI-generated art be copyrighted?", "global", "inter", "It's a gray area — I think the person who created the prompt or edited the output deserves some rights, but not full ownership. Clearer guidelines from copyright offices would help artists and AI companies avoid future legal disputes. On the other hand, some argue AI tools are just another creative tool, like a camera or brush. Overall, I think clearer legal definitions are needed as the technology evolves. Whether this succeeds probably comes down to how thoughtfully it's rolled out over time."],
["Is Vietnam's obsession with celebrity gossip (sao Việt) unhealthy?", "vn", "easy", "To some degree, yes, especially when it distracts from more important news or leads to online harassment of celebrities. It can also normalize invasive reporting that most public figures never actually consented to. That said, some see it as harmless entertainment and a way to unwind. Overall, I think moderation is key, as with most media consumption. This is one of those topics where perspectives can shift considerably depending on someone's personal experience."],
["Should countries introduce a shorter school day for students?", "global", "easy", "It could help reduce stress, as long as the curriculum is adjusted so students aren't just given more homework instead. Countries that have tried this often pair it with more efficient, focused lesson planning. On the other hand, less time in school could reduce opportunities for extracurricular activities. Overall, I think quality of learning time matters more than quantity. As with most policy questions, the details of execution tend to matter as much as the principle behind it."],
